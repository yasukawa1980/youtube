<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>条例ナビ 看板・給水</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* レイアウト：上に分野の切替とかんたん判定、下に自治体カードの一覧（1〜2列） */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #17222b; --muted: #5b6b78;
  --line: #d5dce2; --accent: #0b5c7a; --accent-fg: #ffffff; --accent-soft: #e2eff4;
  --ok: #1d6b3f; --ok-soft: #e1f1e7; --warn: #8a5200; --warn-soft: #fbecd2;
  --ng: #a3271d; --ng-soft: #f9e2df;
  --font: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10171c; --surface: #19232a; --fg: #e6edf1; --muted: #9aabb7;
  --line: #2e3c46; --accent: #6cc3e0; --accent-fg: #0b1a20; --accent-soft: #17323d;
  --ok: #7fd3a0; --ok-soft: #173325; --warn: #f0bb62; --warn-soft: #3a2c10;
  --ng: #f29a90; --ng-soft: #3d1b18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10171c; --surface: #19232a; --fg: #e6edf1; --muted: #9aabb7;
  --line: #2e3c46; --accent: #6cc3e0; --accent-fg: #0b1a20; --accent-soft: #17323d;
  --ok: #7fd3a0; --ok-soft: #173325; --warn: #f0bb62; --warn-soft: #3a2c10;
  --ng: #f29a90; --ng-soft: #3d1b18; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
header h1 { font-size: 1.5rem; margin: 0; line-height: 1.3; }
header p { margin: 4px 0 0; color: var(--muted); }
.notice { background: var(--warn-soft); color: var(--fg); border-left: 4px solid var(--warn); padding: 10px 14px; font-size: .9rem; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { font: inherit; font-weight: 700; padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.panel h2 { margin: 0 0 4px; font-size: 1.1rem; }
.panel .hint { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
.form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 500; }
input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); max-width: 100%; }
input[type="number"] { width: 9em; }
.tablebox { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
td:first-child { white-space: nowrap; font-weight: 700; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ng { background: var(--ng-soft); color: var(--ng); }
.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.filters input[type="search"] { width: 16em; }
.count { color: var(--muted); font-size: .9rem; margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-size: 1.15rem; }
.card .sub { color: var(--muted); font-size: .85rem; margin: 0; }
.card .law { font-weight: 500; margin: 0; }
dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
dt { font-size: .8rem; color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
dd { margin: 0; overflow-wrap: anywhere; }
dd.unknown { color: var(--muted); }
a { color: var(--accent); }
.src { font-size: .8rem; }
.links { margin: 0; padding: 10px 0 0; list-style: none; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
footer { color: var(--muted); font-size: .85rem; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>条例ナビ 看板・給水</h1>
    <p>屋外広告物と給水装置工事のルールを、自治体ごとに見比べられます。</p>
  </header>

  <div class="notice">試作版です。掲載は主要都市のみで、内容は目安です。工事や申請の前に、必ず各項目の「出典」から公式資料を確認し、所轄の窓口に問い合わせてください。</div>

  <div class="tabs" role="tablist" aria-label="分野">
    <button type="button" role="tab" id="tab-signage" data-tab="signage" aria-selected="true">屋外広告物（看板）</button>
    <button type="button" role="tab" id="tab-water" data-tab="water" aria-selected="false">給水装置工事</button>
  </div>

  <section class="panel" aria-labelledby="check-title">
    <h2 id="check-title"></h2>
    <p class="hint" id="check-hint"></p>
    <form class="form" id="check-form">
      <label id="lbl-area">看板の合計面積（㎡）
        <input type="number" id="in-area" min="0" step="0.1" value="6" inputmode="decimal">
      </label>
      <label id="lbl-zone">地域
        <select id="in-zone">
          <option value="normal">住宅地など（一般）</option>
          <option value="commercial">商業地域など</option>
        </select>
      </label>
      <label id="lbl-floors">建物の階数
        <input type="number" id="in-floors" min="1" max="60" step="1" value="4" inputmode="numeric">
      </label>
    </form>
    <div class="tablebox"><table id="check-table"></table></div>
  </section>

  <section aria-label="自治体の一覧" style="display:flex;flex-direction:column;gap:14px">
    <div class="filters">
      <label style="display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500">名前でさがす
        <input type="search" id="q" placeholder="例：京都、福岡">
      </label>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500">地方
        <select id="region"><option value="">すべて</option></select>
      </label>
      <span class="count" id="count"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <p id="checked"></p>
    <p>「未確認」と表示された項目は、公式資料から内容をまだ読み取れていません。出典のリンク先で確認してください。</p>
  </footer>
</div>

<script src="data/signage.js"></script>
<script src="data/water.js"></script>
<script src="app.js"></script>
</body>
</html>
