# Waves of Japan（音楽＋生成したビート信号・3時間）
#
# 2026年8月26日に立てた4本目のライン。同じチャンネルに置く。設計書は WAVE01_テーマ設計.md。
#
# ★★4本目として成立する理由。
#   Whispers は器楽のみ、Sounds of Old Japan は自然音のみ、Days of Old Japan は
#   その二つを重ねる。**このラインだけ素材が「録る／生成させる」ものではなく
#   「計算する」もの**——8〜13Hzのうなりを持つ正弦波の対を ffmpeg で作る。
#   市販の「α波音源」は買わない。正弦波2本なので作れるし、落とした音源は
#   同じファイルが何千本も上がっていて Content ID と再利用判定を踏む。
#
# ★★入る棚が違う。 Whispers と SOJ は「日本語BGM／睡眠BGM」の棚に居るが、
#   このラインが入るのは binaural beats / alpha waves の棚。あそこは
#   紫のフラクタル・幾何学マンダラ・光る脳で埋まっている。
#   **和風の実景を1枚置くと唯一異質になる**——SOJ の「混ぜていないことが差別化」と同じ賭け。
#   ★このラインだけ検索流入が期待できる（`alpha waves` `binaural beats 8hz` は実在の検索語）。
#     Whispers は検索ほぼ0・自動再生95%なので、タイトルの作り方をここだけ変える。
#
# ★★DOJ とは絵で分ける。 DOJ が水彩を担う以上、このラインは写実を守ること。
#   音だけで見ると「Whispers にビートを足したもの」なので、そこは名乗り方（12Hz to 8Hz）で立てる。
#
# ★★3本で9時間の一続きにする。
#   01 α波 12→8Hz / 02 θ波 8→4Hz / 03 δ波 4→1.5Hz。**各巻が次の巻の始点で終わる。**
#   α波(8〜13Hz)は本来「リラックスした覚醒」で睡眠はθとδなので、
#   1巻単体では睡眠BGMの自動再生連鎖に乗れない。3本立てで初めて成立する。

# ★★`extends: oldjapan`。 床が音楽なので whispers を継ぐ筋にも見えるが、
#   この形式に効くのは3時間ぶんの仕組みのほう——track_seconds（リスト）・mosaic・
#   segmented・crossfade 6.0／qsin・final_normalize・thumb.title_family: jp・pill: false。
#   逆に whispers の中核（analyze/select/order のキー・息・一致度）は、
#   5組のパッドを重ねるこの形式では働く余地が無い。
extends: oldjapan

brand: WAVES OF JAPAN

audio:
  # ★SOJ（-16／完成品 -17.6〜-18.0）と揃える。3時間を -14 に持ち上げると
  #   リミッタでうねりが平らになる。★ただし床が音楽なので雨・蝉ほどうねらない。
  #   `mux` 後に測って、Whispers・DOJ 側（-14）に寄せるかは耳で決めること。
  target_lufs: -16
  true_peak: -1.5

  # ★★AAC段のトゥルーピーク増分は純音で **+0.5dB**（-15.0 → -14.5 dBFS を実測）。
  #   雨 +1.0 ／ 蝉 +0.3 ／ 音楽 +0.2〜0.4 の中で中間。
  #   ★これは純音だけの値。床を重ねた実体で必ず測り直すこと。
  mux_gain_db: -0.5

  # ★★★モザイクは「速度ずらし」を必ず止めること（2026年8月28日、実測で確定）。
  #   `mosaic` はもともと虫の声のために書かれていて、`rates` と `detune` で
  #   重ねる層の再生速度をずらして個体差を作る。**音程のある素材ではこれが移調になる。**
  #   既定値のままだと重ねた層の間に **114〜125セント（半音以上）** の開きが出る。
  #   実測（薄暮の1場面300秒で比較。音名エネルギーは最大=100に正規化）:
  #                          G    G#   ラウドネスの振れ
  #     素材1本             91    38    12.3dB
  #     既定(速度ずらし有)   70   *49*    6.9dB   ← G が落ち G# が上がる＝クラスタに潰れる
  #     速度ずらし無         81    28     8.7dB
  #     ★速度ずらし無・3〜4重ね 73  27     5.4dB  ← 採用
  #   ★G# はビート層の 196Hz(G3) の**半音上**で、いちばん当たる音。ここを上げてはいけない。
  mosaic:
    rates: [1.0]
    detune: 0.0
    # ★★重ねは3〜4本。 2〜3本だと振れが8.7dBのこるが、3〜4本で5.4dBまで落ちる
    #   （SOJ02 は 3.7dB を「睡眠用では通せない」としている）。
    #   ★振れの元は素材そのもの（1本で12.3dB）。モザイクは均す側に働いている。
    layers: [3, 4]
    # ★床とは別に点景を作らない。 パッドが散発的に出入りすると音楽では不自然になる。
    bed_lra: 12.0

# ★★ビート層は ambient として敷く。 SOJ01 で ambient が効かなかったのは
#   トラック側そのものが環境音で「埋める隙間が無かった」から。
#   この形式の床は音楽なので、Vol.5（水）Vol.15（虫）と同じく隙間がある。
#
# ★★`no_loop: true` が要る。 素材は最初から3時間あり、しかも時間とともに変化する。
#   既定のループ化は末尾を先頭に重ねる処理なので、掛けると尻の8Hzが頭の12Hzに混ざり、
#   さらに全体が縮んで末尾に頭が戻ってくる。巻の側で file を指すこと。
#
# ★`duck_db` は絶対に使わない。 3時間で4回持ち上げるのは4回起こすこと。
ambient:
  no_loop: true
  # ★-28dB は「言われれば気づく」濃さの見込み。上げると3時間は聴けない。
  #   ★dBは素材をまたいで通用しない（ambient-layer-pipeline）。
  #     `audio` の末尾に出る帯域ごとの実測を見て決め直すこと。
  gain_db: -28
  fade_in: 20.0


thumb:
  # ★帯は `WAVES OF JAPAN` で 619px（Cochin 56・字間8）。右端 x=715。
  #   スクリム右端920に対し165pxの余裕があるので、SOJ02のように字間を詰める必要はない。
  tracking:
    brand: 8
