# ★ショート3本（2026年9月19日。EOJ07〜10 のあとに遡って作った）。決めごとは EOJ02〜04・07〜10 と同じ：
#   ① **旋律の鳴る変奏からだけ採る**（02風が渡る・04底は伴奏音型だけなので45秒に曲の顔が出ない）
#   ② **いちばん暗い絵（場面2 夜）は使わない**（縦のフィードで黒い画面に見える）
