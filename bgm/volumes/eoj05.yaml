# ★★2026年9月8日、1回目の生成が「イメージと違う」となったので場面を書き直した。
#   出てきたのは**高原の草地から海と山を見下ろす風景**で、庭になっていなかった。
#   原因は場面の書き方に3つ穴があったこと：
#     ① `no buildings` と書いたせいで、**庭を閉じる塀も生垣も消えた**（囲いが無いと庭に見えない）
#     ② **遠景を禁じていなかった** → 山と海が入った。★ECJ01の画題が「海」なので競合する
#     ③ `seen from slightly above` では俯瞰にならず、ふつうの風景画になった
#   → **土塀と生垣で奥を閉じ、その向こうを一切見せない**と書き、空は塀の上の細い帯だけにした。
#     飛び石の大きさも「一歩で渡れる幅」と指定（1回目は巨石になっていた）。
#
# ★画題は「苔庭と飛び石」。 既存9巻と幾何が違う（海の水平線／参道の遠近／棚田の層／橋の弧／
#   藤棚の垂れる房／梅の枝の分岐／月と水／縦の幹／蓮の面）。**飛び石は点の連なり**で、
#   しかも**見下ろす構図**になる —— 既存はすべて「見渡す」構図なので、棚で並んだときに形が違う。
# ★★作品版（ECJ05）が藤棚なので、同じ曲の2本が競合しないよう別の画題にした。
scenes:
- 01 朝の苔庭（曲01-02）
- 02 夜（曲03-04。いちばん暗い）
- 03 靄と月（曲05-06）
- 04 明ける（曲07-08。いちばん明るい）
- 05 サムネ専用（本編には使わない）

image_prompts:
- >-
  An enclosed temple moss garden in the early morning. A low earth wall with a tiled
  coping closes the far side of the garden and clipped hedges stand behind it;
  nothing is visible beyond it — no distant hills, no sea, no open horizon, no view
  out. Only a narrow strip of pale sky shows above the wall, at the very top of the
  frame. The ground fills the rest: fine even velvet moss, deep green, with round
  flat stepping stones set into it in an irregular line running from the near edge
  toward the wall, each stone about the width of a single step. Seen from a high
  viewpoint, looking down at the ground. Low morning sun comes in from one side
  almost level, so every stone casts a long shadow across the moss and the moss is
  lit from the side and shows its texture. Deep green, grey stone and warm pale
  light. No figures, no buildings.
- >-
  The same enclosed moss garden at night, the darkest scene of the set. The moss is a
  deep blue-green mass and the stepping stones are pale grey shapes standing out of
  it, catching a little moonlight on their upper surfaces so the line of stones still
  reads clearly across the frame. The earth wall is a dark band closing the far side;
  nothing is visible beyond it. Everything is in shadow, but the shadow is open and
  full of texture, nothing crushed to pure black. No moon in frame, no figures, no
  buildings.
- >-
  The same enclosed moss garden with mist lying low over the ground, and a high small
  moon in the narrow strip of sky above the wall. The nearest stepping stones are
  drawn dark and clear, the next are grey, and the far end of the line has dissolved
  into pale blue-grey. The moss between them is flat and colourless. Cool grey and
  faint green only, no warm colour anywhere. Nothing is visible beyond the wall. No
  figures, no buildings.
- >-
  The same enclosed moss garden at first light, the brightest scene of the set. The
  narrow strip of sky above the wall has turned pale cream, and low warm light
  crosses the moss so that it glows fresh green and the wet stones shine. A few
  fallen petals lie on the moss. Muted woodblock colour, soft green and pale gold,
  light in key but restrained. No saturated colour. Nothing is visible beyond the
  wall. No figures, no buildings.
- >-
  The same enclosed moss garden, composed for a thumbnail. A dark bank of moss under
  a large shadowed rock fills the whole left half of the frame from the very top edge
  down to the bottom edge — an unbroken dark mass, including the upper left corner,
  with almost no detail needed there. Only the right half opens onto the lit moss,
  where the pale stepping stones catch a low bright sky and read as a strong line of
  light points receding toward the earth wall. Nothing is visible beyond the wall.
  Very strong contrast between the dark left half and the lit right, so the image
  still reads at the size of a postage stamp. Muted woodblock colour. No figures, no
  buildings.

