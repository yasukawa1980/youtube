# Echoes of Old Japan / 05 —— アラベスクと月の光
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   ドビュッシーのアラベスク第1番・第2番と月の光を素材に、曲・音階・主音・移調・テンポ・
#   旋律楽器の6軸で8変奏を作り、8秒クロスフェードで繋いだ59分38秒。
#   実装は bgm/EOJ05_アラベスクと月の光/album.py（描画42秒）、構成は同フォルダの 構成.md。
#   ★ECJ05（14分46秒の作品版）と描画器 debussy.py を共有している。
#
# ★★作品版は3曲とも律（陽）だが、この床は中ほどに**都節（陰）を3曲**入れて夜を通す。
# ★★月の光を弧の要に3回置いた（03翳る＝都節・笙／06月が出る＝律・尺八／08還る）。
#   作品版では最後の1曲だった月の光が、床では夜そのものを担う。
# ★この巻は limit で切る必要がない。 原曲がちょうど7〜8分に収まる（ノクターンは7分に切った）。
#
# ★★実測 59分38秒 / −14.3 LUFS / TP −1.3。**二段掛けでは −14.6 にしか届かず、
#   −13.4 を狙って当て込んだ**（入力 −23.70 LUFS でTP側の制約に当たる。ECJ05と同じ現象）。
