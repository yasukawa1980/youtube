- 'Extreme close view at night of the tip of a bare branch against the sky, the twigs forking again and again into finer and finer lines, each one edged with cold moonlight, the tight dormant buds visible along them. The sky behind is a deep even blue, thrown slightly out of focus. Absolutely motionless. Bare deciduous wood only — no pines, no cedars, no evergreens, no bamboo, no leaves, not one leaf anywhere. No snow on the branches, no ice, no icicles. The air is completely still: no motion blur, nothing bending, nothing swaying. Cold blue-grey moonlight, no warm tones, no orange, no amber, no yellow anywhere in the frame. No people, no animals, no birds, no power lines, no buildings, no signage, no lettering of any kind.'
