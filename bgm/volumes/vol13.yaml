# ジャンル側の image_style（露出の指示つき）とガンマ1.3が自動で付く。
#
# ★各文に4つの禁止句を必ず入れる。この巻に固有の事故はすべてここで潰す。
#   1. **常緑樹を落とす** … 杉・松・竹が混ざるとVol.2（竹林）や杉並木に見えて識別が消える。
#      落葉樹の裸の枝だけにする。どの枝にも葉を残さない。
#   2. **雪を落とす** … Vol.9（雪国）と被る。地面は土と落ち葉に霜だけ。枝にも雪を積もらせない。
#   3. **完全な無風** … 枝のブレ・しなり・揺れを禁じる。霜が降りている＝無風の夜の証拠なので、
#      1枚でも風が写ると巻全体の前提が崩れる。
#   4. **現代物を落とす** … Vol.9の教訓。電線・電柱・柵・舗装・街灯・轍。
#      建築物が無いので崩れ字のリスクは低いが、念のため文字も禁じる。
image_prompts:
- 'A stand of bare deciduous trees on a winter night, seen from just outside the wood at eye level, the full moon high in a deep blue sky above the tops. The trunks rise in an irregular, uneven rhythm — nothing is planted in a row. Every branch is completely leafless, the twigs making a fine dark net against the sky. Bare deciduous trees only — no pines, no cedars, no evergreens, no bamboo, no leaves on any branch. The ground is dark earth and dead leaves with a fine white frost lying over it — no snow, no snowdrifts, no snow on the branches. The air is completely still: no motion blur on any branch, nothing bending, nothing swaying. The trees stand in the right two thirds of the frame; the left third is open empty sky. Cold blue-grey moonlight, no warm tones, no orange, no amber, no yellow anywhere in the frame. No people, no animals, no birds, no power lines, no poles, no fences, no paved paths, no street lamps, no buildings, no signage, no lettering of any kind.'
- 'Close view at night of four or five bare tree trunks standing close together, seen straight on at eye level so they cross the frame as dark vertical columns, the wood behind them falling away into open shadow. Cold moonlight rakes down one side of each trunk so the bark reads. Bare deciduous trees only — no pines, no cedars, no evergreens, no bamboo, no leaves on any branch. Frost on the ground at their feet — no snow, no snowdrifts, no snow on the branches. The air is completely still: no motion blur, nothing bending, nothing swaying. Cold blue-grey moonlight, no warm tones, no orange, no amber, no yellow anywhere in the frame. No people, no animals, no birds, no power lines, no poles, no fences, no paved paths, no street lamps, no buildings, no signage, no lettering of any kind.'
