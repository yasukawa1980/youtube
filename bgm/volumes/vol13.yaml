- 'Extreme close view of hard frost on dead leaves and bare earth at night, filling the whole frame: needles of white ice standing up along the edge of every leaf, the veins of the leaves picked out in white, tiny crystals catching the moonlight one by one. Almost abstract. Frost only — no snow, no snowdrifts, no slush, no ice sheet. The air is completely still. Exposed brighter than a typical night shot: shadows open and full of texture, nothing crushed to solid black. Cold blue-grey moonlight, no warm tones, no orange, no amber, no yellow anywhere in the frame. No people, no animals, no birds, no footprints, no power lines, no buildings, no signage, no lettering of any kind.'
