# ★30秒未満のテイクは必ず除外する。analyze の一致度は30秒窓の相関なので、
#   30秒に満たない曲は**全曲との一致度が 0.000 になる**（測れないため）。
#   選抜は一致度の最小化なので、放っておくと指標上いちばん有利な曲として必ず選ばれる。
exclude:
- 金属打（鈴と鉢）のみ５.wav      # 8.4秒
- 金属打（鈴と鉢）のみ７.wav      # 29.2秒

# ★select は書かない。ジャンル側の既定（10曲 / 1500〜1860秒 / max_per_kind 2）を使う。
#   6種×上限2＝12通から10本を選ぶ形。5種だと 5×2＝10 でちょうど埋まり、
#   配分が1通りに固定されて選抜が選抜にならない（Vol.11で判明）。
select:
  # ★ここだけジャンル既定（1500〜1860）を上書きする。下限を28分に上げた。
  #   既定のままだと最良解が25.1分になり、72秒と86秒のテイクが2本入る。
  #   画像1枚＝1曲なので、その2枚だけ表示時間が他の3分の1になってしまう。
  #   28分に絞ると採用曲の最短が133秒になり、一致度は最大0.307→0.344・
  #   平均0.252→0.271とわずかに悪化するだけ（Vol.8の最良0.442より遥かに良い）。
  #   フェーズ1（Vol.1〜10は23〜31分）の真ん中に収まるので、Vol.10の26分14秒と
  #   並べたときに尺の比較がしやすい。2026年8月10日 本人決定。
  total_seconds: [1680, 1860]
  kind_limits:
    ⑥フル編成: [1, 1]
  breath_floor:
    ②尺八: 0.05
    # ★残響ゼロを継続する。Vol.12で尺八の息が 0.0537（Vol.11）→ 0.0799 に増え、
    #   「長い残響の指示が息のノイズを埋める」が確定した。冬の林も壁のない屋外なので
    #   設計上も無理がない。

# select の結果（2026年8月10日）。最大0.344／平均0.271／28.3分。
