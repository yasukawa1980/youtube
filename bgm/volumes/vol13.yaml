# Whispers of Japan Vol.13 — Moonlit Winter Woods（月夜の冬木立）／テーマ「透ける」
#
# ★この巻は実験である。目的は尺の切り分け。
#   8月7日以降、60分超のVol.11とコンピ2本がそろってインプレッション3〜9で頭打ちになった
#   （正常時65〜170）。原因が「60分超という尺」なのか「チャンネル全体の変化」なのかは
#   まだ分離できていない。26〜30分の単独巻を1本出すのが唯一の切り分け手段。
#   **したがって尺以外は変えない。** 題材も作りもフェーズ1（Vol.1〜10）の型に戻す。
#   ここで作りまで冒険すると、伸びても伸びなくても原因が2つになって何も分からなくなる。
#
# ★select は上書きしない。ジャンル側の既定が短尺そのもの
#   （count 10 / 1500〜1860秒＝25〜31分 / max_per_kind 2）。
#   Vol.11・12で書いていた count: 22 などを**書かないこと**が設定作業のすべて。
#
# 差別化の軸は「線の出どころ」。Vol.12（五重塔）は人が積み上げた垂直線を見上げたが、
# Vol.13は自然の不規則な線を水平に見通す。上を向くのは場面3・4だけ。
#
# ★テーマ「透ける」＝葉が落ちた冬だけ、月が枝を透かして届く。
#   夏の同じ場所では梢に遮られて何も見えない。**冬にしか成立しない画**であることが主題。
#
# ★冬木立は「風の音」の期待を生みうる唯一の弱点。解き方は霜。
#   **霜は無風の夜にしか降りない。** 地面に霜を置くことで「風がなかった夜」が絵の中で
#   証明される。タイトル・説明文・タグ・Sunoプロンプトのどこにも `wind` を書かない。
#
# ★注意：`--write` は yaml.safe_dump でこのファイルを丸ごと書き直すため、
#   コメントが全部消える。Vol.12と同じく picked / order_tracks は手で書き込むこと。

genre: whispers
volume: 13
dir: "~/Desktop/Whispers of Japan/Vol13_素材_冬木立"

