# 新しい巻を作るときはこれをコピーする。
# ここに書かないキーは genres/<ジャンル>.yaml の値がそのまま使われる。

genre: whispers
volume: 11
dir: "~/Desktop/Whispers of Japan/Vol11_素材_枯山水"
background: "~/Desktop/Whispers of Japan/Vol11_背景_01.png"

title_lines: [MOONLIT, ZEN GARDEN]     # サムネの2行。168pxで読めるのが唯一の基準
runtime: "64 MIN"                      # 本編の実尺と必ず一致させる（thumb が照合する）

# ファイル名（末尾の " (1)" を除いた形）→ 音色の種類。
# ★分け方は「発音の仕方（撥く/擦る/吹く）と音数」。楽器名だけ変えても構造は揃ってしまう。
#   単一楽器の独奏がいちばん効く。フル編成は1〜2本だけ残してクライマックスに置く。
kinds:
  Some Track Name: ①箏独奏
  Another Track: ②尺八

# 長尺の巻はここで上書きする。
# ★種類数 × max_per_kind ≧ count でないと解が存在しない。22曲なら種類を8つに増やす。
# ★max_per_kind は「種類数 × 上限」が必要本数ちょうどにならない値にする。
#   8種・22曲・フル編成1本のとき上限3だと 3×7+1=22 でぴったり埋まり、
#   配分が1通りに固定されて選抜が選抜にならない（Vol.11で判明）。4にする。
# ★kind_limits には下限も書く。require_all_kinds は「最低1本」でしかないため、
#   一致度の最小化だけだと候補の少ない種が1本まで痩せる（62分で尺八が1回だけになった）。
select:
  count: 22
  total_seconds: [3720, 3960]          # 62〜66分
  max_per_kind: 4
  kind_limits:
    ⑧フル編成: [1, 1]
    ②尺八: [2, 2]
  breath_floor:
    ②尺八: 0.05                        # 息の目立つ笛の目安は 0.05〜0.2

order:
  fixed:
    1: ②尺八                           # チャンネルの看板の音で開ける

# 曲数と同じ数だけ用意する
scenes: []
images: []

# ケンバーンズを既定（寄る/引くを交互・中央/左/右を巡回・最後の2枚は引き）から変える場合だけ書く
# moves: [[in, c], [out, l], ...]

# サムネの文字位置を巻ごとにずらす場合だけ書く
# thumb_layout: {brand: 330, t1: 442, t2: 583, row: 762, use: 892}
