# European Classics, Japanese Instruments / 08 —— ショパン 24の前奏曲から4曲（雨だれ）
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   実装は bgm/ECJ08_雨だれ/（build.py が通しで書き出し、master.py で整音）。
#   選曲の根拠と経緯は bgm/ECJ08_選曲案.md、絵の設計は bgm/ECJ08_雨だれ/ECJ08_テーマ設計とプロンプト.md。
#   ★描画器 piano.py は ECJ07 のものに `lh_mel`（拍の区間）を足しただけ。
#     雨だれの中間部（第28〜75小節＝拍108〜300）は**旋律が左手の最低音**にあり、
#     元の規則のままだと尺八が雨だれの連打を吹く（試作1回目で43音の88%が同じ高さだった）。
#
# ★★曲は測ってから決めた。 ECJ06の選曲調査は**使った作曲家（ベートーヴェン・サティ・ショパン・
#   ドビュッシー）を最初から除いていた**ので、その4人の117曲を足して測った（bgm/ECJ08_選曲調査/）。
#   4曲とも**律・主音B**。本当の旋律の線で測った ずれ／潰れ：
#     第7番 0.0 / 15.2　第2番 2.3 / 2.3　第13番 1.1 / 7.1　雨だれ 0.0 / 16.7（1曲あたり和11.2）
#   ★一括計測は雨だれの中間部で**右手の同音連打**を、第6番で右手の和音を旋律として測っていた。
#     曲ごとに線を指定して測り直す（bgm/ECJ08_選曲調査/_調査_本当の旋律線.py）。3例目。
#
# ★★この巻の売り：**「雨だれ」の雨音は崩れない。**
#   中間部で右手が打ち続ける同じ音（雨だれの名の由来）は、和の音階へ写しても**潰れ0.6%**。
#   箏の同じ糸を打ち続ける形になる。★鎖樋（くさりどい）はその形を絵にしたもの。
#
# ★実測 11分31秒 / **−14.0 LUFS / Peak −1.9**（wav）。
#   ★曲間は GAP 1.5秒で**聞こえる曲間は約3秒**（−40dB未満で2.95〜3.35秒）。
#     ECJ07までの trim は −80dB まで尾を残しており、GAP 3.5秒の設定で実測6.5〜6.9秒あった。
# ★浄書は 第7番・第15番が PD（Edition Peters）、**第2番が CC BY-SA 3.0（Donald Axel）**、
#   **第13番が CC BY-SA 4.0（Knute Snortum）**。楽曲は4曲ともPD。
#   ★★「CC BY」ではなく **ShareAlike 付き**（2026年9月12日に `.ly` の maintainer/licence 行で確認）。
#     浄書者名は目録に入っていないので `.ly` を見ること。使うのは音高と音価だけなのでECJ07と同じ整理。
genre: europeanclassics
volume: 8
slug: ecj08
dir: "/Volumes/ESD-EPB/BGM/6_European Classics/ECJ08_素材_雨だれ"

runtime: "12 MIN"
# ★ECJ04 が `[NOCTURNES, CHOPIN]` なので、**2行目が同じ作曲家名になる**。
#   見分けは1行目（RAINDROP）と絵（雨・紫陽花）でつける。
title_lines: [RAINDROP, CHOPIN]
thumb:
  title_family: serif
  title_fit: 760

# ★★画題は「山寺の雨」。 ECJ01＝海、02＝参道、03＝棚田、04＝橋、05＝藤棚、06＝竹林、07＝雪の庭、
#   EOJ01＝月と水、02＝森、03＝蓮池、04＝梅林、05＝苔庭、06＝枯山水。
#   **「軒の水平線から、一本の鎖が垂直に下がる」は未使用。** 季節も梅雨だけが空いていた。
# ★★4枚で崩してはいけない幾何：①上端を横切る軒としずくの列 ②中央やや右に鎖樋と丸い石の水鉢
#   ③左に縁と柱の列 ④右下と手前に紫陽花 ⑤奥は土塀と瓦で閉じる ⑥石畳は足もとに少しだけ（SOJ01と競合するため）
# ★露出の実測（16未満の割合／平均輝度）：
#     01 0.90% / 110.7　02 1.48% / 89.9　03 **6.13% / 59.7**（ガンマ0.85を当てた。元は13.55%）
#     04 **8.13% / 54.3**（ガンマ0.80。元は20.43%）　05 サムネ 14.49% / 55.4（ガンマ0.80。元は33.28%）
#     06 冒頭 4.15% / 73.2
#   光の弧は 明（朝）→ 温（夕）→ 暗（夜）→ 最も暗い（夜更け）→ 暗（夜へ戻る）。
#
# ★★★区切りが5つあるのは、雨だれが A-B-A の形だから。
#   `video.py` は**絵の切替を manifest の区切りにしか置けない**（画像の枚数は曲数の約数）。
#   曲は4つだが絵は5区間なので、**manifest を5区切りで置き直してある**
#   （第7番と第2番は同じ絵。雨だれを 主部前半／中間部／主部後半 に割る）。
#   区切り 0:00 / 2:50.79 / 6:04.81 / 7:43.60 / 10:37.70。
#   ★中間部の出入りは**音のいちばん静かなところ**を実測で選んだ（−20.1dB / −12.9dB）。
scenes:
- 01 第7番・第2番／梅雨の朝（いちばん明るい）
- 02 第13番／雨の小止みの夕方（いちばん温かい）
- 03 雨だれ 主部／灯籠の夜
- 04 雨だれ 中間部／雨脚の強まる夜更け（いちばん暗い）
- 05 雨だれ 主部へ戻る／同じ灯籠の夜（03と同じ絵）

image_anchor: [0.5, 0.5, 0.5, 0.5, 0.5]

