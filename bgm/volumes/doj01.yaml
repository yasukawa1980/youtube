# Days of Old Japan / 01 —— 夏（作品名は未定）
#
# ★★在庫だけで組む巻。 新規生成はゼロ。
#   Vol.15の曲置き場130本のうち、Vol.15が使った22本を除いた**残り108本**を写した。
#   種の内訳は memo の記録と完全に一致：尺八30・琵琶26・フル編成12・胡弓9・箏8・
#   ピアノ7・金属打6・笙5・龍笛5。**⑤風鐸だけ無い**（2本は LongNights3_素材 に残置）ので9種。
#
# ★★残り物どうしは似ている。 memo の実測で、153本全体の一致度の中央値0.346に対し
#   残り93本は0.370。良いものから抜かれた結果で構造的に避けられない。
#   それでも22曲・58分なら 隣接の最大0.316／平均0.279 で、公開済みのVol.10（0.348）より良い。
#
# ★曲数は20（ジャンル既定）。 22ではなく20なのは画像の枚数を約数にするため。
#   22の約数は 1・2・11・22 だけで5枚が作れない。20なら 4・5・10 が選べる。
#
# ★★kind_limits の下限が要る。 memo の Vol.11 の反省——一致度の最小化だけだと
#   候補の少ない種が1本まで痩せる（62分のうち尺八が1回だけになった）。
#   9種 × 下限2 = 18 ≤ 20 なので全種に2本の下限を置ける。
#   ★上限は種類数×上限が必要本数ちょうどにならない値にすること（9×4=36 ≠ 20 なのでよい）。

genre: daysofoldjapan
volume: 1
slug: doj01
dir: "/Volumes/ESD-EPB/Whispers of Japan/DOJ01_素材"

select:
  count: 20
  total_seconds: [3000, 3600]     # 50〜60分
  require_all_kinds: true
  max_per_kind: 4
  kind_limits:
    ①箏: [2, 4]
    ②尺八: [2, 4]
    ③ピアノ: [2, 3]
    ④金属打: [2, 3]
    ⑥胡弓: [2, 4]
    ⑦笙: [2, 3]
    ⑧龍笛: [2, 3]
    ⑨琵琶: [2, 4]
    ⑩フル編成: [2, 3]

# ★★環境音はまだ決めていない。 題材が決まってから選ぶ。
#   濃さも -18 / -14 / -10 の3段で組んで試聴してから決める（ジャンルの既定は仮の -14）。
