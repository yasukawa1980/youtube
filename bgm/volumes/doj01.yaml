# Days of Old Japan / 01 —— 風鈴の縁側
#
# ★★在庫だけで組む巻。 新規生成はゼロ。
#   Vol.15の曲置き場130本のうち、Vol.15が使った22本を除いた**残り108本**を写した。
#   種の内訳は memo の記録と完全に一致：尺八30・琵琶26・フル編成12・胡弓9・箏8・
#   ピアノ7・金属打6・笙5・龍笛5。**⑤風鐸だけ無い**（2本は LongNights3_素材 に残置）ので9種。
#
# ★★残り物どうしは似ている。 memo の実測で、153本全体の一致度の中央値0.346に対し
#   残り93本は0.370。良いものから抜かれた結果で構造的に避けられない。
#   **それでも実測は 隣接の最大0.312／平均0.268**（2026年8月26日）。
#   Long Nights 3（0.311/0.269）とほぼ同じで、公開済みのVol.10（0.348）より良い。
#
# ★曲数は20。 22ではなく20なのは画像の枚数を約数にするため。
#   22の約数は 1・2・11・22 だけで5枚が作れない。20なら 4・5・10 が選べる。
#   **20曲＝5枚なら4曲ごとに切り替わる。**
#
# ★★kind_limits の下限が要る。 memo の Vol.11 の反省——一致度の最小化だけだと
#   候補の少ない種が1本まで痩せる（62分のうち尺八が1回だけになった）。
#   9種 × 下限2 = 18 ≤ 20。実際に全種2本以上で収まった（琵琶だけ4本）。
#   ★上限は種類数×上限が必要本数ちょうどにならない値にすること（9×4=36 ≠ 20 なのでよい）。
#
# ★実測 20曲・53.0分。 題名の `| 53 Min` はこれに合わせる。
#
# ★★環境音は2層（2026年8月26日、素材を実測して確定）。
#
#   地＝`夏の山2.mp3`（蝉の巻の素材を流用）。SOJ02の実測で
#     **こもり +28.6 と最も遠く**、変動3.6と最も安定し、ステレオも0.32。
#     ★遠い蝉であることが要。 蝉の巻を出した直後なので、近い蝉だと主役が重なる。
#
#   点＝風鈴5本。**長尺2本（155秒・60秒）は使わない。**
#     実測で打音の間隔の**76〜85%が0.5秒未満**、最大3秒。強い風で鳴りっぱなしの
#     録音で「風が来ては去る縁側」ではなく、53分通すと消耗する。
#     短尺5本（5.7〜6.8秒・孤立した打音・地が-61〜-74dB）が正解だった。
#
#   ★★風鈴は `sprinkle`（点で置く）で、`file`（敷く）ではない。
#     雨・蝉・虫は通して鳴るので敷けばよいが、風鈴は間欠音。
#     実測で 5分に5回・1回2〜3秒・沈黙93% になる。
#   ★L/Rは0.93（ほぼ点音源）。 素材が4本ともモノラルなためだが、
#     **風鈴は本来ひとところで鳴るものなので、これは正しい姿**。広がりは地が担う。
#
# ★濃さは実測で決め直すこと。 dBは素材をまたいで通用しない。
#   `audio` の最後に出る「静かなところの底が何dB上がったか」を見る。
ambient:
  file: "/Volumes/ESD-EPB/BGM/2_Sounds of Old Japan/SOJ02_素材_蝉/環境音/夏の山2.mp3"
  gain_db: -16
  sprinkle:
    gain_db: -12
    every: [25, 70]      # 次の打音までの秒数。平均47秒に1回
    spread: 0.6
    seed: 3
    files:
    - "/Volumes/ESD-EPB/BGM/3_Days of Old Japan/DOJ01_素材/環境音/audiostock_1155257.wav"
    - "/Volumes/ESD-EPB/BGM/3_Days of Old Japan/DOJ01_素材/環境音/audiostock_1155262.wav"
    - "/Volumes/ESD-EPB/BGM/3_Days of Old Japan/DOJ01_素材/環境音/audiostock_1256853.wav"
    - "/Volumes/ESD-EPB/BGM/3_Days of Old Japan/DOJ01_素材/環境音/audiostock_62136.mp3"
    - "/Volumes/ESD-EPB/BGM/3_Days of Old Japan/DOJ01_素材/環境音/audiostock_848201.wav"

