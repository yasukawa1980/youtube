# Echoes of Old Japan 総集編 01 —— 9巻・8時間46分52秒（EOJL01）
#
# ★★音は作り直していない。 公開済み9巻の music_bed.wav を巻の境で8秒の等電力クロスフェードで
#   つないだだけ（`bgm/EOJL01_つなぐ.py`）。 実測 −14.0 LUFS / LRA 7.2 / TP −1.2（wav）。
# ★★wav は RF64（約6.1GB。WAVの4GB上限を超える）。
# ★画は各巻の本編4枚をそのまま（9巻×4＝36枚）。 manifest も場面単位の36本にしてあるので1曲1枚。
# ★作業先は ESD-02（ESD-EPB 未接続・内蔵は空き26GB で足りない）。 設計は `bgm/EOJL01_テーマ設計.md`。

genre: echoesofoldjapan
volume: 101
slug: eojl01
dir: "/Volumes/ESD-02/BGM/5_Echoes of Old Japan/EOJL01_素材_8時間"

# runtime は書かない（EOJはサムネに尺を描かない。8:46 は「8 HOURS」の±3分照合に落ちる）
cta: true

# ★サムネは2案を Studio の「テストと比較」に掛ける（10/26 本人：作曲家3人の顔を入れる案）。
#   A＝題字だけ（このyamlで焼く）、B＝A にバッハ・ショパン・シューベルトの丸窓を足す（`bgm/EOJL01_サムネB.py`）。
#   下地は EOJ04 のサムネ専用画（梅林。右半分が空で、丸窓を置いても絵の主役を隠さない）。
title_lines: [朝まで8時間]
