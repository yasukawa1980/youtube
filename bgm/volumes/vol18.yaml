image_style: >-
  Photorealistic cinematic still, a traditional Japanese tea garden at night.
  The only light source is the moon: cool blue-silver, low key — except that the
  small camellia flowers keep their own deep red colour, softened by the moonlight,
  the one warm colour in the picture. There are no lamps, lanterns or fires anywhere
  and every window is dark.
  Exposed so that texture is clearly visible everywhere — moss, frost, stone, thatch,
  earthen wall, wood grain. Shadows are lifted and open, full of visible detail,
  nothing crushed to pure black. High dynamic range, rich texture even in the
  darkest areas.
  Calm and completely static, no people, no animals, no text, no signage,
  no lettering of any kind. Muted blue and green palette apart from the camellia red,
  fine film grain, 16:9 composition with generous empty space on the left third for titles.

