# Kominka Café / 04 —— 冬の薪火
#
# ★★音は bgmkit の外で作っている（select / order / audio は使わない）。
#   PD曲17曲を Salamander のピアノで鳴らし、**同じ曲順で2巡**。実装は bgm/KCF04_冬の薪火/build.py。
#
# ★★冬の巻だが、**音では冬を鳴らさない**（薪のはぜる音・風の音・雪の音を入れない）。
#   KCF02が「絵だけが雨」、KCF03が「絵だけが秋」で通したのと同じ理屈。
#   ラインの規則（ピアノ1台）は4巻目も保たれている。
#   → 説明文に「火の音が入っている」と読める書き方をしない。
#
# ★音の作りは **KCF02＝KCF03をそのまま踏襲**（旋律0.60／バス0.44／内声0.32／
#   残響16%／曲間2.0秒）。KCF01→02で本人が聴いて決めた値なので、4巻目で第3の設定を作っていない。
#
# ★★選曲は MD5 に加えて **「同じ曲の別浄書」も題で照合した**（2026-09-24に判明した穴）。
#   `ChopinFF__Chop-28-4a.mid`（Peters版）は KCF02 の `Chop-28-4.mid` と MD5 は別だが同じ Op.28-4。
#   ★チャイコフスキー 四季「1月 炉端にて」はこの巻の題材そのものだが **KCF01が既出**（MD5一致）。
#    四季は「2月」を採った。
#   17曲すべて licence = Public Domain。KCF01・02・03・ECJ・EOJ と1曲も重ならない。
#
# ★実測 105分25秒 / −14.02 LUFS / TP −1.50 / LRA 4.50。KCF01=77分・02=87分・03=89分を超えて**ラインで最長**。
