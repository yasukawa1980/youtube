# 題材＝月夜の城／テーマ「守る」
#   石垣が城を守る／城が眠る野を守る／月が一晩それを見守る。
#   **攻められたことのない城が、平和な一夜の番をしている**という読み。戦の絵にはしない
#   （甲冑・旗・武器を全面禁止にしたのはこのため）。聞き手の休息を「守る」巻でもある。
#
# ★差別化の軸は「人が積んだ垂直の石」。 Vol.15（平らに開けた野・自然・銀）の真逆に置いた。
#   Vol.12五重塔も「見上げる建物」だが、あちらは細い木の塔と屋根の反復。
#   こちらは**石垣の扇の勾配（下が緩く上が立つ曲線）と白壁**が主役で、形が違う。
#   Vol.7棚田が「人が積んだ地形」の水平版だったとすれば、これは垂直版。
# ★シリーズで初めて「内部の建築」へ入る巻でもある（11〜14の櫓の廊下と天守の梁）。
#   Vol.10座敷は畳と庭の住まい、こちらは何も置かれていない木組みの空間。
# ★白壁は月光を最もよく返す素材。サムネ候補は17（天守を仰ぐ・引き）と01（遠望）。
#   22枚が揃ってから168pxで実測して決める（Vol.15と同じ手順）。
# ★★2026年9月28日 22枚受領（Codex生成・1672×941）→ 17に決定。168pxの左半分の地 20.2
#   （01は29.1・21は39.7）。暗幕を掛けた完成サムネでも題字・天守・月が168pxで読める。
# ★13〜15は「天守の中から天守が見える」矛盾があるが、本人判断でこのまま使う（小天守・櫓からと読める）。
# ★潰れ（16未満）が15%を超えた9枚（03 04 08 11 12 13 14 15 20）を lift で11%へ寄せた。
#   11は36.6%→11.3%（指数0.80）、12は29.6%→10.6%（0.77）。元は 画像/旧版/ に退避。
#   調整後は22枚とも2.3〜14.8%。
