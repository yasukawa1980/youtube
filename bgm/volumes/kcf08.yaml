# Kominka Café / 08 —— 囲炉裏端（初冬の、よく晴れて冷えた日の昼。炉の炭火のそば）
#
# ★Whispers of Japan の巻（IRO ではない）。2026-11-07 本人が題材「囲炉裏端」を選択（候補 B 霜晴れの朝／C 窯元の茶房）。
#   設計は bgm/KCF08_テーマ設計.md、Suno・画像の全文は bgm/KCF08_コピー用プロンプト.md。
#   ★音は KCF06・07 と同じ Suno のピアノ独奏。ピアノ1台・和の音階にしない・昼・ジャズにしない。
#   ★2巡にしない（全曲別の曲）。曲間2.0秒のハードカットは既刊と同じ。Salamander と混ぜない。
#   ★Suno の長さはカスタム3:30（3:00 は句の途中で切れる＝KCF06）。
#
# ★季節＝初冬（KCF07 晩秋／KCF04 冬の間）。雪は出さない（KCF04・WAVE05/11・Vol.9）。火は炉の炭火だけ・炎を立てない。
