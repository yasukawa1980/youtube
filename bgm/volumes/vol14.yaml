#   ★Vol.12で「実測61分48秒→表記62 Min」の判断が要った。秒が30以上なら切り上がるので、
#     実尺を見てから thumb を回す（runtime を直さずにサムネを作ると尺バッジがずれる）。
runtime: "60 MIN"                      # 実測 3575.55s = 59分35秒 → 四捨五入で60

