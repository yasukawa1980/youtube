# Whispers of Japan Vol.14 — Moonlit Pine（月夜の松）／テーマ「巡る」
#
# ★2026年8月12日、素材が揃った。画像22枚・楽曲87本（8種）。選抜まで完了。
#   プロンプトは `~/Desktop/Whispers of Japan/Vol14_コピー用プロンプト.md`（画像22 + Suno 8種）。
#
# 差別化の軸は「単一の対象を全方位から」。既存13本＋コンピ2本はどれも“場所”を旅していた。
# この巻は一本の松だけを撮る。松は最後まで動かず、動くのはカメラだけ。
#
# ★Vol.13の真逆になるのが狙い。冬木立＝裸・細い線・透ける／松＝常緑・黒く重い塊・透けない。
#   一覧で並んだときに同じ「木の巻」に見えないこと。
#
# ★この巻の最大の弱点は「松風」。日本語圏で最も強い音の連想を持つ言葉なので、
#   タイトル・説明文・タグ・Sunoプロンプトのどこにも `wind` を書かない。
#   絵の側は完全な無風（ブレ・しなり・揺れの禁止）で解く。
#
# ★次に強い弱点は「海」。松＝白砂青松でAIは浜辺を出したがるが、
#   海が写ると波音を期待され、無いと即離脱になる。全プロンプトで海を否定してある。
#
# ★注意：`--write` は yaml.safe_dump でこのファイルを丸ごと書き直すため、
#   コメントが全部消える。picked / order_tracks は手で書き込むこと。
#   ★2026年8月12日、実際に一度消した。復旧に使ったのは scratchpad の restore.py。
#     select / order は `--write` 無しで回し、出力を見て手で貼ること。

genre: whispers
volume: 14
dir: "~/Desktop/Whispers of Japan/Vol14_素材_松"

