# ★30秒未満のテイクは必ずここに入れる。一致度は30秒窓の相関なので、
#   30秒に満たない曲は全曲との一致度が 0.000 になり、選抜で必ず勝ってしまう。
exclude:
- 金属音１.wav          # 8.6秒
- 木の打楽器.wav        # 12.0秒
- 木の打楽器６.wav      # 17.1秒
- 琵琶３.wav            # 23.0秒
- 木の打楽器１.wav      # 28.6秒

# ★60分（22曲）の設定。
select:
  count: 22
  total_seconds: [3600, 4000]

  # ★上限4。8種×4＝32本ぶんの枠から22本を選ぶ形。
  #   `種類数 × 上限` が22ちょうど（例：8種で上限3なら足りない、11種で2なら固定される）だと
  #   配分が1通りに決まって選抜が選抜にならない。余地の残る最小構成が8種×4。
  max_per_kind: 4

  # ★下限を必ず書く。`require_all_kinds` は「最低1本」でしかないため、
  #   一致度の最小化だけだと候補の少ない種が1本まで痩せる。
  #   Vol.11では62分のうち尺八が1回だけになった（しかも1曲目固定なので以降ゼロ）。
  kind_limits:
    ②尺八: [2, 4]          # breath_floor で候補が減るので、痩せる筆頭
    ⑥琵琶: [2, 4]          # 新規枠。1本に痩せると枠を足した意味がなくなる
    ⑦木の打楽器: [2, 4]     # 同上
    ⑧フル編成: [1, 2]       # クライマックス用。多すぎると特別でなくなる

  breath_floor:
    ②尺八: 0.05
    # ★残響ゼロを継続する（Vol.12で息が0.0537→0.0799に増えた）。丘の上なので設計上も無理がない。
    # ★2026年8月12日の実測：20本中2本しか通らなかった（0.0703 と 0.0613）。
    #   歩留まり10%は Vol.12（12本中5本）Vol.13（12本中2本）より悪い。
    #   本数を倍にしても率は上がらなかった。下限2本にちょうど届いただけで余地はない。
    #   惜しいのは 尺八の独奏１６.wav の 0.0491。

# 1曲目はチャンネルの看板の音（尺八）で開ける。
# ★クライマックスは15曲目。場面8A（月を背にした逆光のシルエット）＝15枚目に合わせてある。
#   絵がいちばん強くなる瞬間に⑧フル編成を置く。サムネもこの1枚。
# ★22曲は左から埋める分枝限定では覆えない（22! ）ので、order は自動で山登りに切り替わる
#   （`order.local_search_from` 既定14）。Vol.11で0.348→0.285になった経路。
order:
  fixed:
    1: ②尺八
    3: ③ピアノ独奏
    15: ⑧フル編成

