# ★⑥琵琶と⑦木の打楽器が新規枠。どちらも減衰系（撥く・叩く）。
# ★2026年8月12日、今回は全ファイルがNFCで落ちてきた（Vol.13の分解形の事故は起きず）。
# ★「Moon Behind the Pine.wav」だけSunoの自動命名で系列から外れていた。
