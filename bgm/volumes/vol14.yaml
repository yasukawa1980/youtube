# 168pxで効くのは「光る空に浮かぶ黒い一本の木」という形の単純さ。
# Vol.13が「枝の網目」という細かい形だったので、この巻は逆に大きな塊で識別させる。
# ★2026年8月12日に実物で確認済み。168pxでも樹形が保たれ、左半分が空いていて題字が乗る。
background: "~/Desktop/Whispers of Japan/Vol14_素材_松/画像/vol14_15.png"

title_lines: [月夜の, 松]
