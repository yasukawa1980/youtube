# Kominka Café / 05 —— 蔵の二階
#
# ★★音は bgmkit の外で作っている（select / order / audio は使わない）。
#   実装は bgm/KCF05_蔵の二階/build.py。
#
# ★★この巻から **17曲×2巡 をやめて 10曲×2巡 にした**（2026年9月27日）。
#   テンポ健全な候補197曲のうち「90〜380秒・密2.0〜7.0」に入るのは30曲で、**うち21曲がバッハ**。
#   残り9曲からチャイコフスキー2曲（既に「賑やかで合わない」と判断）とKV331の2曲（KCF03が主題を使用）を
#   除くと使える非バッハは4〜5曲しかなく、そのままだと17曲中10曲がバッハになる。
#   → **尺だけで捨てていた長い緩徐楽章を4曲入れた**（テンペスト第2楽章・K.457第2楽章・
#     C.P.E.バッハのロンド・シューベルトD.935-2。いずれも7〜8分で遅く疎い）。
#   結果 **作曲家7人・バッハ3曲**（KCF04は7曲）。曲間が少ないぶん作業用として途切れない。
#
# ★★**テンポが変わる曲は選ばない**（`bgm/_KCF_テンポ変化は無視される.md`）。
#   `render()` は `tempos[0]` しか読まないので、楽譜の大半が別のテンポで書かれた曲は
#   狙いと違う速さで鳴る。この巻の10曲は先頭以外のテンポで書かれた拍が20%未満のものだけ。
#
# ★**季節を持たせない巻**（KCF01と同じ）。春はKCF06以降に空けてある。
# ★音の作りは KCF02＝03＝04 のまま（旋律0.60／バス0.44／内声0.32／残響16%／曲間2.0秒）。
# ★選曲はMD5と「題の正規化」の両方で照合。10曲すべて licence = Public Domain。
# ★実測 103分47秒 / −14.03 LUFS / TP −1.50 / LRA 4.90。
