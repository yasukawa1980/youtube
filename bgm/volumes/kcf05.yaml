# ★★この巻だけショートの幕を作り直した（2026-09-27）。
#   ジャンル既定（top 900 → full 1700・opacity 0.82・gamma 1.2）は**夜や土間の暗い絵向け**で、
#   蔵は**白漆喰が主役＝文字の乗る面が明るい**ため足りなかった。
#   既定のまま焼いたときの題字帯は **61 / 71 / 57**（KCF04のA・Bは30・40）。
#   題字は読めたが、**曲名の行と `KOMINKA CAFE` が白漆喰に負けて薄かった**。
#   ★自動増強は効いていない——`_text_area_lum` は y1200から下の**全面平均**で判定するので、
#     下地135〜136に対して 0.82→0.83 と誤差程度しか濃くならなかった。
#   → **幕の立ち上がりを早く・急にした**（top 800 → full 1450・gamma 1.0・opacity 0.86）。
#     題字の位置 y1330 での不透明度が 0.40 → 0.70 になり、題字帯は 35〜42 に落ちる見込み。
#     帯の位置（brand 1238 / title 1330 / sub 1462）は `genres/ykl.yaml` ではなく
#     `whispers` 由来の short.layout で決まっている。
short:
  scrim:
    top: 800
    full: 1450
    gamma: 1.0
    opacity: 0.86

