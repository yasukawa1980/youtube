# ★max_per_kind: 3 は不可。8種×3に対しフル編成を1本に絞ると 3×7+1=22 でちょうど
#   埋まり、配分が1通りに固定されて選抜が選抜にならない（テイクが3本の種は全数採用）。
#   4にして余地を残す。22曲中4曲＝18%で、Vol.9の「10曲中4曲が同じ音色」とは別物。
#
# ★kind_limits の下限が要る。require_all_kinds は「最低1本」でしかないため、
#   一致度の最小化だけだと団子を作る⑥笙と、breath_floor で候補が減る②尺八が
#   1本まで痩せる。62分で尺八が1回だけ（しかも order.fixed で1曲目に固定）になった。
#   長尺では毎回起きるので、ジャンル側に min_per_kind を置くほうが筋がよいかもしれない。
select:
  count: 22
  total_seconds:
  - 3720
  - 3960
  max_per_kind: 4
  kind_limits:
    ⑧フル編成:
    - 1
    - 1
    ②尺八:
    - 2
    - 2
    ⑥笙:
    - 2
    - 4
  breath_floor:
    ②尺八: 0.05

# 17曲目＝場面9A「最も長い影」＝クライマックス。
# ⑧フル編成は1本しかないので、bgmkit 側で「後ろの固定枠のぶんを取り置く」修正が要った。
order:
  fixed:
    1: ②尺八
    17: ⑧フル編成

