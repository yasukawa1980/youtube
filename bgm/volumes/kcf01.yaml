# ★画題は「古民家を改めたカフェ」。既刊と幾何が被らない（横に伸びる土間の床と、斜めに差す光の帯）。
#   人は描かない。湯気とカップで「カフェ」と一目で分からせる。
scenes:
- 01 西日の土間（00:00-16:25）
- 02 格子窓とコーヒー（16:25-35:59）
- 03 梁と光の柱（35:59-52:54。いちばん明るい）
- 04 夕方の縁側（52:54-終わり。いちばん暖色）
- 05 サムネ専用（本編には使わない）

