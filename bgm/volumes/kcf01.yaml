genre: kominkacafe
volume: 1
slug: kcf01
dir: "/Volumes/ESD-EPB/BGM/7_Kominka Cafe/KCF01_素材_土間の午後"

runtime: "77 MIN"
# ★このラインだけ題字が日本語（視聴者が日本の中高年で、この棚は日本語で探されるため）。
