# ★ショート3本。3本で3曲。★開始位置は1分刻みで「45秒の本体」と「頭4秒」を測って選んだ（9/28）。
#   A は1:51＝アリア前半の繰り返しの頭（48拍÷26bpm）。有名な冒頭の旋律がここでもう一度始まる。頭 +1.2dB
#   ★anchor は元画像の切り抜き開始 = anchor × (1672−529)。鹿と月の座標から決める（1回目は3本とも外した）
#   B 32:00 頭 +0.4（31:00 は −2.7 で落とした）／C 48:00 頭 +1.0（46:00 は頭+5.0だが本体が −15.0 と静か）
shorts:
- tag: A
  image: 1
  anchor: 0.66        # ★0.45だと牡鹿が右端で切れ牝鹿が枠外。2頭（元画像 x 810〜1290）を入れる
  at: "0:01:51"       # 01「アリア」律G・尺八（前半の繰り返しの頭）
  title: アリア
  sub: [月の出 尺八, 1時間版はチャンネルに]
  move: in
- tag: B
  image: 3
  anchor: 0.67        # ★0.60だと月が右端で欠けた。牡鹿（x 830〜1050）と月（1150〜1230）を両方入れる
  at: "0:32:00"       # 05「底」第25変奏・都節F#・尺八
  title: 第25変奏
  sub: [月下の鹿 尺八, 1時間版はチャンネルに]
  move: out
- tag: C
  image: 4
  anchor: 0.90        # ★0.40だと鹿が1頭も映らない。鹿は右端（x 1060〜1530）
  at: "0:48:00"       # 07「明ける」第30変奏・律G・笙
  title: 第30変奏
  sub: [白む 笙, 1時間版はチャンネルに]
  move: in

