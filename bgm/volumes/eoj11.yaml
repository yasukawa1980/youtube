# Echoes of Old Japan / 11 —— ゴルトベルク変奏曲（バッハ BWV988）
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   アリアと第13・15・21・25・26・30変奏から8変奏（アリアは頭と終わりの2回）。
#   実装は bgm/EOJ11_ゴルトベルク/album.py、構成は同フォルダの 構成.md。
#   ★眠れない伯爵のために書かれた、という逸話のある曲（真偽は疑わしい。説明文でもそう書く）。
#
# ★★アリアは全音で測ると ずれ24.4% だが、骨格（0.45拍以上）では 律G 0.0/1.5。
#   壊れているのは16分の装飾だけで、床のテンポではそれは箏に落ちる。
#
# ★浄書は Mutopia（CC BY-SA 3.0）。楽曲はPD。音高と音価だけを使う（EOJ01 と同じ扱い）。

# ★★画題は「萩と鹿」（萩の茂みに閉じた山裾の小さな空き地に野生の鹿）。
#   `grep` で 鹿/deer/萩/bush clover とも既刊0件。
#   ★すすき野は Vol.15・WAVE07（芒原）で使用済みなので外した → 「No pampas grass」と書いてある。
#   ★EOJ02「森の内側」と被らないよう、森の中ではなく**森に閉じた空き地**。
#   ★EOJ05 の教訓：奥は近い丸い山で閉じ、遠景（山並み・海・湖）を禁じてある。
#   ★場面2をいちばん暗くする（音の陰＝第15・21変奏に絵の夜を当てる）。
# ★露出は受け取ってから実測する（16未満の割合）。サムネは題字の乗る側の地を 12〜16 に。

genre: echoesofoldjapan
volume: 11
slug: eoj11
dir: "/Volumes/ESD-EPB/BGM/5_Echoes of Old Japan/EOJ11_素材_ゴルトベルク"

runtime: "59 MIN"   # ★manifest の 3510.4秒 を round すると59分（実尺 58分30秒）
# ★2026/10/8 公開中のサムネを B案（用途＋太明朝W6）に差し替えたので題字も合わせた。旧：[GOLDBERG, BACH]
#   焼いた版は `_B案_20261008/eoj11_B.jpg`（差し替え前の版は thumb_out に残っている）
title_lines: [眠れぬ夜に, ゴルトベルク]
thumb:
  title_family: jp       # ★10/8 serif（英語のCochin）から日本語へ
  title_fit: 760
  tracking:
    brand: 4

# ★★2026/9/28 決定。新しい巻は必ず書く（本編1:00に小さく・ショート3行目）
cta: true

scenes:
- 01 月の出（曲01-02。萩の空き地に牡鹿と牝鹿、丸い山の上に月が昇る）
- 02 闇（曲03-04。★いちばん暗い。月は雲の裏。鹿は萩の下に伏している）
- 03 月下の鹿（曲05-06。★見せ場。満月に頭を上げて鳴く牡鹿）
- 04 白む（曲07-08。露の萩と薄い霧。去る鹿が一頭振り返る。いちばん明るい）
- 05 サムネ専用（本編には使わない。左三分の一が手前の萩の影）

# ★プロンプトの全文は bgm/EOJ11_ゴルトベルク_画像プロンプト/ にも同じものが置いてある（Codex へ渡すのはそちら）。
image_prompts:
- >-
  A small hidden clearing at the foot of low wooded hills in Japan in early autumn, overgrown with
  Japanese bush clover (hagi): tall bushes whose long slender fronds arch over and droop under their
  own weight in soft fountains, covered in tiny rose-purple flowers, closing the clearing in on the
  left, the right and the back. Behind them rises one dark, gently rounded wooded hillside close by,
  which fills the background and shuts out any further view: no distant mountains, no sea, no lake, no
  river, no far horizon. No pampas grass, no buildings, no lanterns, no torii. Wild sika deer are in
  the clearing. It is dusk just after sunset, and a large pale moon is rising above the rounded
  hillside, a little left of centre. A stag with young antlers and a doe stand in the open grass in
  the middle distance among the arching fronds, the stag with his head turned towards the moon. The
  sky is a soft gradated wash from warm apricot low down to pale violet above, and the flowers catch
  the last warm light. Apricot, violet-grey, rose-purple flowers, dark green-black hill. Japanese
  shin-hanga woodblock print in the manner of the 1920s-30s revival: flat layered areas of colour,
  visible woodgrain in the flat passages, softly gradated sky (bokashi), Western perspective and cast
  light held inside Japanese printmaking. The deer are drawn as part of the print, in the same flat
  woodblock manner, never photographic. Calm, no people, no figures. Strong clear difference between
  the light and dark masses so the image still reads when reduced to a thumbnail. No text, no
  signature, no seal stamp, no lettering of any kind. No modern objects: no power lines, no utility
  poles, no electric lamps, no vehicles, no plastic, no road markings. Wide 16:9 landscape. Exposed so
  that texture is clearly visible everywhere. Shadows are lifted and open, full of visible detail,
  nothing crushed to pure black. High dynamic range, rich texture even in the darkest areas.
