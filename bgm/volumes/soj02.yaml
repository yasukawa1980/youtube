# Sounds of Old Japan / 02 — 蝉時雨（A Day of Cicadas）
#
# ★シリーズ共通の設定（曲間6秒・qsin・2段のラウドネス・分割書き出しなど）は
#   genres/oldjapan.yaml。ここに残すのは この巻に固有のものだけ。
#
# ★★この巻は「一日の移ろい」で三幕を作る。 雨の巻が「音が遠くこもっていく」で
#   三幕を作ったのと同じ仕掛けを、種の入れ替わりでやる。
#     第一幕 明け方（ヒグラシ）1-6
#     第二幕 朝ニイニイ 7-9 → 真昼アブラ・ミンミン 10-13
#     第三幕 午後ツクツクボウシ 14-17 → 夕暮れヒグラシ 18-22
#   ★ヒグラシで始まりヒグラシで終わる。 一日が閉じる。
#
# ★★アブラゼミを主役にしない。 3〜6kHzに密集した音で、3時間浴びると耳が疲れる。
#   真昼は22場面のうち4場面だけ（10-13）に抑え、いちばん近くて明るい
#   `アブラゼミの鳴き声2`（こもり +82.3）は12だけに置く。
#
# ★★素材は全部短い（合計8.7分・最長68.8秒）。 モザイクで敷き詰める。
#   order_tracks の1項目＝その場面の素材の組で、2〜3本を重ねた「片」を継いでいく。
#   重ねる範囲を幕の中に閉じているのはここ。明け方のヒグラシに真昼のアブラゼミを
#   重ねると設計が壊れるので、幕をまたぐ組は作らない。
#
# ★作業先はSSD。3時間の書き出しで4GB超。

genre: oldjapan
volume: 2
slug: soj02
dir: "/Volumes/ESD-EPB/Whispers of Japan/SOJ02_素材_蝉"
tracks_subdir: 環境音

title_lines: [A DAY OF, CICADAS]
# ★16字なのでジャンル既定の題字172でよい（SOJ01は26字で150に落とした）。
runtime: "3 HOURS"

# 22本 × 497秒 − 21 × 6秒 = 10808秒 = 3時間00分08秒（SOJ01と同じ）。
track_seconds: 497

audio:
  # ★★mux 後に必ず実測して決め直すこと。 -1.5 は雨で測った値で、
  #   蝉は4〜9kHzに寄っているのでAAC段のオーバーシュート量が違うはず。
  mux_gain_db: -1.5

  mosaic:
    # ★片は30〜50秒。 素材の使えるところが6〜55秒なので、雨向けの40〜70では
    #   ほとんどの素材が片の中で何周もする。素材の尺に寄せた。
    cell: [30, 50]
    layers: [2, 3]
    # ★床の線を7.0にしてある（既定6.0）。 ツクツクボウシの鳴き声1 が LRA 6.4 で、
    #   既定だと点景に落ちる。51秒あるステレオの良い素材なので床に使いたい。
    bed_lra: 7.0
    seed: 2

# ★★床と点景は実測で決まっている（2026年8月25日、LRAで分類）。
#   床（LRA≤7）… 昆虫・セミ04 0.0 ／ 昆虫・セミ01 0.1 ／ ニイニイゼミ 0.7 ／
#                ダウンロード 0.7 ／ アブラゼミ 0.8 ／ ニイニイゼミの鳴き声 1.2 ／
#                ミンミンゼミの鳴き声 2.8 ／ ミンミンゼミヒグラシループ 3.4 ／
#                夏の山2 3.6 ／ ツクツクボウシの鳴き声2 4.4 ／ ツクツクボウシ 5.6 ／
#                ツクツクボウシの鳴き声1 6.4
#   点景（LRA>7）… ミンミンゼミが鳴く雑木林 8.8 ／ アブラゼミの鳴き声2 9.0 ／
#                 ヒグラシの鳴き声 11.4 ／ ヒグラシ 15.6
#   ★どの場面の組にも床が最低1本入っていること。 入っていないと _mosaic が止まる。
#
# ★★`ダウンロード.mp3` はアブラゼミ（脈14.0Hz／主帯5857Hz）。名前で判断しないこと。
#   実測で アブラゼミ 13.1〜14.9Hz、ヒグラシ 6.9〜8.5Hz と割れている。
#   ★落とし直したら名前を付け替えること。
order_tracks:
# ── 第一幕 明け方（ヒグラシ）まだ薄暗い。鳴いているのは蜩だけ ──────────
- [夏の山2.mp3, ヒグラシの鳴き声.mp3]                                    # 1  明ける前
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3]                  # 2  杉の梢
- [ミンミンゼミヒグラシループ.mp3, 夏の山2.mp3, ヒグラシの鳴き声.mp3]            # 3  谷を渡る声
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3, ヒグラシの鳴き声.mp3]  # 4  石段
- [ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3]                             # 5  朝靄
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシの鳴き声.mp3]            # 6  日が差す
# ── 第二幕 朝（ニイニイ）→ 真昼（アブラ・ミンミン）──────────────────
- [ニイニイゼミの鳴き声.mp3, 昆虫・セミ01.mp3]                              # 7  朝の庭
- [ニイニイゼミの鳴き声.mp3, ニイニイゼミ.mp3, 昆虫・セミ01.mp3]               # 8  土塀
- [ニイニイゼミの鳴き声.mp3, 昆虫・セミ01.mp3, ミンミンゼミが鳴く雑木林.mp3]      # 9  雑木林へ ★移り
- [ミンミンゼミの鳴き声.mp3, ミンミンゼミが鳴く雑木林.mp3, 昆虫・セミ04（複数）.mp3]  # 10 木漏れ日
- [ミンミンゼミの鳴き声.mp3, ダウンロード.mp3, 昆虫・セミ04（複数）.mp3]          # 11 真昼 ★アブラ入る
- [ダウンロード.mp3, アブラゼミの鳴き声2.mp3, ミンミンゼミが鳴く雑木林.mp3]        # 12 日盛り ★いちばん近い
- [ミンミンゼミの鳴き声.mp3, アブラゼミ.mp3, ミンミンゼミが鳴く雑木林.mp3]         # 13 影が伸び始める
# ── 第三幕 午後（ツクツクボウシ）→ 夕暮れ（ヒグラシ）──────────────────
- [ツクツクボウシの鳴き声2.mp3, ミンミンゼミが鳴く雑木林.mp3]                   # 14 午後 ★移り
- [ツクツクボウシの鳴き声1.mp3, ツクツクボウシの鳴き声2.mp3, ツクツクボウシ.mp3]   # 15 竹林
- [ツクツクボウシの鳴き声2.mp3, ツクツクボウシの鳴き声1.mp3]                   # 16 縁側
- [ツクツクボウシの鳴き声1.mp3, ツクツクボウシ.mp3, 夏の山2.mp3]               # 17 傾く日 ★蜩が混じり始める
- [夏の山2.mp3, ツクツクボウシの鳴き声2.mp3, ヒグラシの鳴き声.mp3]              # 18 暮れ方
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3]                  # 19 山の端
- [ミンミンゼミヒグラシループ.mp3, 夏の山2.mp3, ヒグラシの鳴き声.mp3]            # 20 灯がともる
- [夏の山2.mp3, ヒグラシ.mp3]                                          # 21 暮れきる
- [夏の山2.mp3, ヒグラシの鳴き声.mp3]                                    # 22 夜へ ★最も遠い

# 1場面＝1トラック＝8分17秒。継ぎ目が少ないほど睡眠用として良い（SOJ01と同じ）。
