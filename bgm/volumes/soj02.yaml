# Sounds of Old Japan / 02 — 蝉時雨（A Day of Cicadas）
#
# ★★2026年8月25日、22場面から**5場面**に変更（本人の提案）。
#   根拠は競合の実測：結果を出しているBGM動画は3時間でも場面の切り替わりが3〜5回しかなく、
#   サムネと本編に女性が出る。枚数を捨てて1枚ずつの質に寄せる判断。
#   ★22場面は5つの光の状態（青灰→緑金→白金→琥珀→藍）を割ったものだったので、
#     5場面はその5つそのもの。一日の弧も種の入れ替わりも1つも失っていない。
#   ★継ぎ目が21回→4回に減る。書き出しのクロスフェードの鎖も21段→4段。
#   ★1枚が25〜50分映り続ける。ごまかしが効かないので画像の要求水準が跳ね上がる。
#   （22場面版は scratchpad/soj02_22場面版.yaml に控えてある）
#
# ★シリーズ共通の設定は genres/oldjapan.yaml。ここは この巻に固有のものだけ。
#
# ★作業先はSSD。3時間の書き出しで4GB超。

genre: oldjapan
volume: 2
slug: soj02
dir: "/Volumes/ESD-EPB/Whispers of Japan/SOJ02_素材_蝉"
tracks_subdir: 環境音

title_lines: [A DAY OF, CICADAS]
runtime: "3 HOURS"

# ★★尺は場面ごとに変える。 一日は5等分ではないし、素材の厚みも揃っていない。
#   2400+1500+1800+2100+3032 − 4×6 = 10808秒 = 3時間00分08秒
#     1 明け方ヒグラシ 40:00  素材92秒（主役なので長く取る）
#     2 朝ニイニイ     25:00  素材46秒（いちばん薄いので短く）
#     3 真昼          30:00  素材100秒（疲れる帯域なので長くしない）
#     4 午後ツクツク   35:00  素材113秒（いちばん厚い）
#     5 夕暮れヒグラシ 50:32  素材92秒（★最長。ここまで起きている人はほぼ居ない）
track_seconds: [2400, 1500, 1800, 2100, 3032]

audio:
  # ★★mux 後に必ず実測して決め直すこと。 -1.5 は雨で測った値。
  mux_gain_db: -1.5
  mosaic:
    cell: [30, 50]
    layers: [2, 3]
    # ★床の線は7.0（既定6.0）。ツクツクボウシの鳴き声1 が LRA 6.4 で、
    #   既定だと点景に落ちる。51秒あるステレオの良い素材なので床に使いたい。
    bed_lra: 7.0
    seed: 2

# ★★`ダウンロード.mp3` はアブラゼミ（脈14.0Hz／主帯5857Hz）。名前で判断しないこと。
#   実測で アブラゼミ 13.1〜14.9Hz、ヒグラシ 6.9〜8.5Hz と割れている。
#
# ★★`アブラゼミの鳴き声2.mp3` は使っていない。 こもり +82.3 と最も近くて明るく、
#   3〜6kHzに密集した音を真昼の30分ぶん浴びると耳が疲れる。22場面版では1場面に
#   閉じ込めていたが、5場面だと真昼のどこにでも出てしまうので外した。
#   アブラゼミ自体は `ダウンロード` と `アブラゼミ` で残っている（種は失っていない）。
#   ★戻すなら3番の組に足すだけ。
#
# ★★`ツクツクボウシ.mp3` も外した（2026年8月25日、組んで比べて判断）。
#   完全なモノラル(L/R 1.00)なのに LRA 5.6 で**床**に分類され、全重量で鳴り続けて
#   午後35分のステレオ像を引き締めていた。しかも主帯2024Hzと他の2本(5125/5706)から
#   外れていて、7点測って4点をこの1本が支配していた。
#   実測 3本版 → 2本版：変動 2.8→1.7 ／ L/R 0.27〜0.49→**0.07〜0.09** ／
#   主帯 2040〜5600（ばらつく）→5211〜5986（安定）。
#   ★引き換えに自己相関が 0.079→0.102 とわずかに上がる（素材が1本減るため）。
#   それでも場面1・2と同じ水準なので、広さと音色の一貫性を取った。
order_tracks:
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3, ヒグラシの鳴き声.mp3]
- [ニイニイゼミの鳴き声.mp3, ニイニイゼミ.mp3, 昆虫・セミ01.mp3]
- [ミンミンゼミの鳴き声.mp3, ミンミンゼミが鳴く雑木林.mp3, ダウンロード.mp3, アブラゼミ.mp3, 昆虫・セミ04（複数）.mp3]
- [ツクツクボウシの鳴き声1.mp3, ツクツクボウシの鳴き声2.mp3]
- [夏の山2.mp3, ミンミンゼミヒグラシループ.mp3, ヒグラシ.mp3, ヒグラシの鳴き声.mp3]

# ★1場面＝1枚。25〜50分ずっと映る。「情景」ではなく「見ていられる絵」を作ること。
scenes:
- 明け方・杉木立の石段を上る（青灰／ヒグラシ）
- 朝・農家の庭と縁側（緑金／ニイニイゼミ）
- 真昼・大樹の木陰から野を見る（白金と陽炎／アブラ・ミンミン）
- 午後・竹林の小径を歩く（琥珀／ツクツクボウシ）
- 夕暮れ・里を見下ろす（琥珀から藍／ヒグラシ）

# ★★人物は麦わら帽子の少し元気目の女性。 絵は写実のまま、柔らかさは光とレンズで出す
#   （逆光・浅い被写界深度・暖色寄りの低コントラスト）。舞台は大正〜昭和初期の田舎。
# ★★サムネだけは別画像（顔あり）。 本編5枚は顔を見せない。
#   クリックを取るのはサムネの顔で、そこは1枚だけなので崩れを徹底して検品できる。
#   本編は1枚25〜50分映り続けるので、顔があると見つめられ続けて必ず粗が見つかる。
background: "/Volumes/ESD-EPB/Whispers of Japan/SOJ02_素材_蝉/画像/soj02_thumb.png"
images:
- soj02_01.png
- soj02_02.png
- soj02_03.png
- soj02_04.png
- soj02_05.png

# ★★縦型ショート5本。 一日の5つの時刻から1本ずつ採る。
#   本編が「一日の移ろい」なので、ショート5本を並べるだけで構成が伝わる。
#   字幕の1行目を時刻と種にしてあるのはそのため（SOJ01は5本とも同じ文言だった）。
#
# ★曲の頭からは採らない（クロスフェードで薄い）。どれも場面の頭から十分内側。
#   場面の頭＝ 0:00 / 39:54 / 64:48 / 94:42 / 129:36
#
# ★anchor は 16:9 を 9:16 に切るときの横位置。中央の32%しか残らないので、
#   主役が中央にいない絵は中央で切ると枠外に出る。実際に切って目で確認して決めた。
shorts:
- tag: A
  image: 1            # 明け方・杉木立の石段。女性は右寄り
  anchor: 0.66
  at: "0:15:00"
  title: 蝉時雨
  sub: [明け方のヒグラシ, 3時間版はチャンネルに]
  move: in
- tag: B
  image: 2            # 朝・縁側。女性はやや右
  anchor: 0.56
  at: "0:48:00"
  title: 蝉時雨
  sub: [朝のニイニイゼミ, 3時間版はチャンネルに]
  move: out
- tag: C
  image: 3            # 真昼・大樹の木陰。女性と幹を両方入れる
  anchor: 0.68
  at: "1:15:00"
  title: 蝉時雨
  sub: [真昼のアブラゼミ, 3時間版はチャンネルに]
  move: in
- tag: D
  image: 4            # 午後・竹林の小径。女性は右寄り
  anchor: 0.67
  at: "1:45:00"
  title: 蝉時雨
  sub: [午後のツクツクボウシ, 3時間版はチャンネルに]
  move: out
- tag: E
  image: 5            # 夕暮れ・里を見下ろす。女性は左寄り、月と里は右
  anchor: 0.38
  at: "2:30:00"
  title: 蝉時雨
  sub: [夕暮れのヒグラシ, 3時間版はチャンネルに]
  move: in
