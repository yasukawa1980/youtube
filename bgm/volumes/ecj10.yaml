# ★★画題は「鯉のぼりの里」（子供の情景 ↔ こどもの日。本人了承 9/14）。
#   ECJ01＝海、02＝参道、03＝棚田、04＝橋、05＝藤棚、06＝竹林、07＝雪の庭、08＝山寺の雨、09＝書院の丸窓。
#   **「空に立つ1本の竿から横へ泳ぐ3つの形」は未使用。** 風で時刻を語り、トロイメライの月夜は無風で垂れる。
# ★★曲は7つ・絵は4区間。`video.py` は絵の切替を manifest の区切りにしか置けないので、
#   **SSDの `_work/manifest.json` は4区切り**（0 / 182.09 / 467.55 / 716.18）。
#   Mac側（`bgm/ECJ10_トロイメライ/_work/manifest.json`）は `build.py` が書く7区切りのまま。
#   **→ `build.py` を走らせ直してMac側をSSDへ写すと4区切りが消える。**
