# European Classics, Japanese Instruments / 10 —— シューマン「トロイメライ」と子どもの曲（ECJの一区切り）
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   実装は bgm/ECJ10_トロイメライ/（`build.py` が通しで書き出し、`master.py` で整音）。
#   選曲の経緯は `bgm/ECJ10_選曲案.md`、絵の設計は `bgm/ECJ10_トロイメライ/ECJ10_テーマ設計とプロンプト.md`。
#   ★`build.py` の `prep_for` で、MIDIのテンポ地図（リタルダンド・フェルマータ）を拍に写してから `piano.py` に渡す。
#
# ★★7曲とも **律・主音G**。1曲あたりのずれ＋潰れの和 7.2＝ラインでいちばん壊れない（既刊最良はECJ08の11.2）。
#   子供の情景 1・4・5 → 子供のためのアルバム 3・26・32 → 子供の情景 7「トロイメライ」で閉じる。
#   繰り返しは 見知らぬ国・トロイメライだけ未展開だったので展開した（68-26・68-32はMIDIで展開済み）。
#
# ★実測 14分57秒 / **−14.0 LUFS / Peak −1.9**（wav。入力 −13.99 で当て込み不要）。本人の試聴で了承（9/14）。
