# ★60曲で3時間ちょうどにするには選抜合計が約183分（平均183秒）要る。
#   在庫の中央値は178.4秒・最長229.5秒しかないので、やや長めに寄せた選抜になる。
#   total_seconds はクロスフェード後の値で見るので、10900〜11100秒＝2時間58分〜3時間5分。
# ★max_per_kind は10。「種類数×上限」が必要本数ちょうどにならない値にすること
#   （10種×10＝100で60にならない。ちょうどだと配分が1通りに固定されて選抜が選抜にならない）。
# ★kind_limits の下限が要。在庫の偏りが極端（尺八43本 対 琵琶4本）なので、
#   一致度の最小化だけに任せると本数の多い種で埋まり、少ない種が1本まで痩せる（Vol.14の④金属打）。
select:
  count: 60
  total_seconds: [10900, 11100]
  require_all_kinds: true
  max_per_kind: 10
  # ★1リスタート13.5秒。既定の60回だと13分。在庫が均質で最大一致度が下がりにくいので多めに回す。
  restarts: 150
  kind_limits:
    ①箏: [5, 10]
    ②尺八: [6, 10]
    ③ピアノ: [5, 10]
    ④金属打: [5, 10]
    ⑤風鐸: [4, 6]
    ⑥胡弓: [5, 10]
    ⑦笙: [4, 10]
    ⑧龍笛: [3, 5]
    ⑨琵琶: [3, 4]
    ⑩フル編成: [6, 10]
  # 下限の合計46・上限の合計85。60本がその間に入っている。

# 60曲は当然ながら局所探索（ジャンル既定の local_search_from は14）。
# Vol.11（22曲）で 0.348→0.285 まで下がった手。60曲では restarts を増やしてある。
order:
  restarts: 400


