# Whispers of Japan / Long Nights 3 — 3時間版
#
# ★巻数を付けない別ライン（Long Nights）の3本目。Comp1「月夜の山道」・Comp2「月夜の寺の庭」に続く。
#   本編Vol.15にはしない。153本はVol.11〜14と同じプロンプト群から出た兄弟で、
#   編成・キー・空間を設計し直す工程が無いため（詳細はメモリ whispers-series-plan）。
#
# ★素材＝Vol.11〜14の未使用テイク153本・7.42時間（2分未満は除外済み。全部未公開）。
#   内訳 v11=22 / v12=45 / v13=37 / v14=49。デコード前MD5で重複が無いことは確認済み。
#   ファイル名は巻をまたいで衝突するので v11_ 〜 v14_ を前置してある。
#
# ★作業先はSSD。3時間はピークで15GB前後使い、内蔵の空き23GBでは足りない（メモリ ssd-storage）。
#
# ★注意：`--write` は yaml.safe_dump でこのファイルを丸ごと書き直すため、コメントが全部消える。
#   select / order は --write 無しで回し、出力を手で貼ること（Vol.14で一度消している）。

genre: whispers
slug: long3
dir: "/Volumes/ESD-EPB/Whispers of Japan/LongNights3_素材"

# 題材＝月夜の灯籠道／テーマ「更ける」（2026年8月13日 本人決定）
# ★サムネの元画は場面4A＝7枚目（望遠で圧縮した灯の縦列）。2026年8月14日に168pxで実測して決定。
#   場面1Aは道と手前の灯籠が主役になり、肝心の「橙の点の連なり」が168pxで消える。
#   7枚目は橙の粒が画面を縦に登る形で、既存14枚のどれとも似ない。
background: "/Volumes/ESD-EPB/Whispers of Japan/LongNights3_素材/画像/long3_07.png"

# ★Long Nights は巻数を付けない。タイトルは固有名だけ。
title_lines: [月夜の, 灯篭道]
# ★シリーズ初の時間表記。「Min で通す、Hour は2時間以上から」（本人決定）に従う。
#   thumb.check_runtime は時間表記を ±3分で突き合わせる（2026年8月13日に対応）。
