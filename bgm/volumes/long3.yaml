#
# ★曲の頭からは採らない。 曲頭はクロスフェードで薄いので、そのまま切ると
#   出だしが本体より十数dB低くなる。Vol.15のショートCがそれで19dB低かった。
#   → どれも曲頭から+60秒の位置。`short` が切る前に頭と本体を比べて警告を出す。
#
# ★縦画面に合う絵を選んである（灯の列が縦に登る／見上げ／一基）。
#   横に広い構図は9:16に切ると主役が枠外へ出る。
