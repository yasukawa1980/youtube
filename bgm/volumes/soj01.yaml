- 雨の庭・引き

# 画像は手生成（16:9でそのまま出す。切り出しは掛からない）。
# ★★2026年8月23日、22枚に **ガンマ1.6を適用済み**（元は 画像/_原本/ にある）。
#   この巻は光源が提灯だけで題材が暗く、露出の一文を入れても潰れが
#   中央値28.3%・最大69.6%まで出ていた（同じ手生成のVol.15は中央値2.7%・最大8.6%）。
#   1.6で 中央値2.7%・輝度48.1 とVol.15の実測にほぼ一致。ハイライトの飛びは最大0.57%。
#   **二重に掛けないこと。** 作り直すときは _原本/ から取る。
# ★全枚に効かせる禁止は5つ。プロンプト本文に埋め込んである。
#   1. 文字 … 提灯・のれん・看板・木札。この題材の最大の弱点（Vol.8の山門と同じ構造）。
#      **提灯は無地と明示する**
#   2. 雨の縦線 … AIの雨は画面を横切る引っかき傷になる。
#      濡れた面・波紋・滴・遠景の霞で描かせ、線そのものは禁じる
#   3. 現代物 … 電線・電柱・室外機・車・LED・白線・プラスチック（Vol.9と同じ）
#   4. 顔と手 … 後ろ姿のみ。手は袖に隠す。他の人物は1人も出さない
#   5. 月 … 雨雲の下に月は無い。出ると画が嘘になる（この巻だけ月を描かない）
# ★★2026年8月25日：画像19と20は、当初の場面設計と順序が入れ替わっている。
#   生成された絵の中身が 19=行灯のそば / 20=手水鉢 だったため、`scenes:` を実物に合わせた。
#   （本編は既に書き出し済みで、絵は19→20の順に出る。並びとしては
#    「行灯のそばに座る → 庭の手水鉢へ目をやる → 戻ると誰もいない座敷」となり、
#    当初案より自然なので絵は差し替えない。説明文のチャプター名を実物に合わせてある。）
# ★DL順＝場面順の確認は抜き取りでは足りない。 4・18・22の3枚だけ見て通したため
#   隣接の入れ替わりを取り逃がした。次からは全枚を並べて照合すること。
