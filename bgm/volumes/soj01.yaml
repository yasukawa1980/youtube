# ★★縦型ショート3本（2026年8月25日）。`python3 -m bgmkit short soj01`
#   三幕から1つずつ採り、音が「通り→軒下→屋内」と引いていく設計をショートでも見せる。
#
# ★anchor で切り位置を横にずらしている。 16:9を9:16に切ると中央の32%しか残らないので、
#   主役が中央にいない絵は中央で切ると枠外に出る。
#   場面4は和装の女性が右寄り（元画の57〜74%）にいるため 0.72 に寄せた。
#
# ★曲の頭からは採らない（クロスフェードで薄いため）。どれも場面の頭から+60秒。
#   `short` が切る前に頭と本体を比べて警告を出す。
shorts:
- tag: A
  image: 4            # 番傘の後ろ姿＝サムネと同じ絵。この巻の顔
  anchor: 0.72        # 女性が右寄りなので右へ寄せて切る
  at: "0:25:33"       # 第一幕（石畳の雨）
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: in
- tag: B
  image: 12           # 軒下から見る通り。9:16に切って一番明るい人物入りの絵
  anchor: 0.62
  at: "1:31:01"       # 第二幕（軒下）
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: out
- tag: C
  image: 20           # 手水鉢に降る雨。第三幕。雨そのものが写るのでAB（人物）と対比になる
  anchor: 0.60
  at: "2:36:29"       # 第三幕（屋内）
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: in
- tag: D
  image: 17           # 障子紙に映る雨。9:16で最も明るい（平均103）
  at: "2:11:56"
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: in
- tag: E
  image: 7            # 傘の下から・見上げ★人物
  at: "0:50:06"
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: out
- tag: F
  image: 5            # 水たまりの波紋。雨そのものが写る
  at: "0:33:44"
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: in
- tag: G
  image: 1            # 通りの入口★人物（遠景）
  at: "0:01:00"
  title: 雨の石畳
  sub: [雨の音だけ, 3時間版はチャンネルに]
  move: out

