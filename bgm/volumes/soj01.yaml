# Sounds of Old Japan / 01 — 雨の石畳（Rain on the Lantern Street）
#
# ★★2026年8月24日、Whispers の Vol.16 ではなく**別シリーズの1本目**にした（本人決定）。
#   楽器がゼロで、作り方も見た目も題名の作法も違う。Whispers の Vol.16 は
#   次の「音楽の」巻のために空けてある。分離した理由は genres/oldjapan.yaml に書いた。
#
# ★シリーズ共通の設定（曲間6秒・qsin・2段のラウドネス・分割書き出しなど）は
#   genres/oldjapan.yaml に移した。ここに残すのは この巻に固有のものだけ。
#
# ★尺の律速が無い。 曲の在庫もSunoの歩留まりも関係ないので3時間にできる。
#   同じ3時間を音楽で作ることは、いまの在庫では不可能だった。
#
# ★作業先はSSD。内蔵の空きが9GBしかない（3時間の書き出しだけで4GB超）。
#
# 設計の全体は SOJ01_テーマ設計.md、画像22枚は SOJ01_コピー用プロンプト.md。

genre: oldjapan
volume: 1
slug: soj01
dir: "/Volumes/ESD-EPB/BGM/2_Sounds of Old Japan/SOJ01_素材_雨の石畳"

# 環境音を「曲」として置くので、楽曲/ ではなく 環境音/ から読む。
tracks_subdir: 環境音

# ★サムネは場面4（番傘の後ろ姿）が第一候補。ただし決めるのは実測。
#   22枚を168pxに落として、題字が乗る帯の最大輝度とばらつきを測ってから確定する
#   （Vol.15は当初候補の13が「文字の下に月が入り込む」で落ちて19になった）。
background: "/Volumes/ESD-EPB/BGM/2_Sounds of Old Japan/SOJ01_素材_雨の石畳/画像/soj01_04.png"

title_lines: [雨の石畳]

# ★★この巻は題字を 172 → 150 に落とす（2026年8月23日、168pxで実測して判断）。
#   既定の172は「168pxで読めない要素は無いのと同じ」→ 題字を最大に、という判断から。
#   だがこの巻は作品名が26字と長く、172だと2行目が右端1700pxまで伸びて
#   **和装の女性の頭と番傘を横切る**（過去巻のはみ出しは最大でもVol.15の469px、この巻は780px）。
#   人物はこの巻の差別化そのものなので、それを隠すのは本末転倒。
#   150なら右端1495pxでVol.15（1389px）と同程度に収まり、168pxでも十分読める（実測済み）。
#   ★B案そのものを否定していない。長いタイトルの巻だけの例外。
thumb:
  sizes:
    title: 150
# ★mux 後に実測済み：3時間00分08秒。`3 HOURS` で整合している。
runtime: "3 HOURS"

# ★22本 × 497秒 − 21 × 6秒 = 10808秒 = 3時間00分08秒。
#   素材が60秒しかなくても継ぎ目の聞こえないループにして敷き詰める（audio.py の _extend）。
track_seconds: 497

# ★analyze / select / order は使わない。 22本は vet の「こもり」の大きい順に、
#   第一幕（近くて開けた雨）から第三幕（遠い・屋内のこもった雨）へ手で当てる。
#   素材が揃ったら下を埋める：
#
#     python3 -m bgmkit vet "…/SOJ01_素材_雨の石畳/環境音"
#
# ★2026年8月22日、21本を vet で検品して13本合格。その13本を三幕に当てた。
#   並べる基準は「こもり」（高域/低域のエネルギー比 dB）で、幕が進むほど音が遠くこもる。
#   1本を2〜3回使うが、**隣り合う場面には同じ素材を置いていない**。
#   雨は音程も位相も持たないので、1時間離れた場面での再登場は聞き分けられない。
#
#   落ちた8本と理由：
#     somaa26-rain-birds           音程あり42倍＝鳥。夜の雨に昼の鳥は乗らない
#     imsogabriel_stock-dripping   衝撃音3.5%＋音程5倍＋実質モノラル
#     freesound_community-rain-dripping-17639  72秒に衝撃音／76%が120Hz未満
#     water-dripping-on-rain-gutter 変動12.1dB。滴りだけの録音は地が無く使えない
#     bongo4310                    変動4.4dB（あと一歩）
#     dragon-studio-copyright-free 120Hz未満32%。468秒・変動1.0と惜しい
#     liecio-calming-rain          120Hz未満34%
#     eryliaa-rain-on-umbrella     左右相関1.00＝実質モノラル
#     da-wa-wa-i--115693           ★試聴で不採用（2026年8月23日 本人）。雨が強すぎ、人声が入っている
#     rain-med-porch-2nd-floor     ★試聴で不採用（2026年8月23日 本人）。トラック内の揺れが
#                                  **8.9 LU** と突出（次に大きいのが3.9、中央値2.4）。雨脚がうねる。
#                                  ★この巻で唯一「粒」を持っていた素材だったが、
#                                  睡眠用では安定を取った。第二幕の滴はここで諦めている。
#     rain-on-umbrella-20159       ★実測で不採用。**-14 LUFS に届かない**（入力 -40.7 LUFS / TP -6.2 で
#                                  上げるとクリップするため -22.5 止まり）。隣より8.5dB低いまま8分鳴り、
#                                  継ぎ目が -6〜-9dB へこんでいた。場面7・11は metal-roof に差し替え。
#                                  ★題材としては「傘」がぴったりだが、音の破綻のほうが害が大きい。
#                                  どうしても傘の音が要るなら eryliaa-rain-on-umbrella（変動1.0と非常に安定。
#                                  ただし実質モノラルで8分間ステレオ像が潰れる）が代案。
#
# ★★人声は vet では拾えない（da-wa-wa-i の音程は1.2倍で鳥の42倍と桁が違う）。
#   話し声は摩擦音が広帯域で、強い雨に埋もれると平坦度がほとんど動かない。
#   **この検査で落とせるのは鳥・虫・楽音まで。人声は必ず耳で確かめること。**
order_tracks:
# ── 第一幕 通りを歩く（開けて広い。粒が立つ）──────────────
- boons_freak-rain-sound-188158.mp3                    # 1  通りの入口     こもり +10.8
- robmoscreative-dripping-rain-drops-376028.mp3        # 2  濡れた石畳      +7.4
- dragon-studio-relaxing-rain-444802.mp3               # 3  格子戸の連なり   +5.2
- soundsforyou-rain-on-metal-roof-123632.mp3           # 4  番傘の後ろ姿     +3.4
- boons_freak-rain-sound-188158.mp3                    # 5  水たまりの波紋   +10.8
- robmoscreative-dripping-rain-drops-376028.mp3        # 6  辻の常夜灯      +7.4
- soundsforyou-rain-on-metal-roof-123632.mp3           # 7  傘の下から      +3.4 ★傘の内側なのでこもった素材を当てる
- dragon-studio-relaxing-rain-444802.mp3               # 8  石橋と堀        +5.2
# ── 第二幕 軒下（雨が近い。滴が一つずつ聞こえる）──────────────
- freesound_community-heavy-rain-under-porch-25785.mp3 # 9  軒下に入る      +8.8
- freesound_community-rain-from-porch-30654.mp3        # 10 軒の雨だれ    +4.6
- soundsforyou-rain-on-metal-roof-123632.mp3           # 11 立てかけた番傘   +3.4
- freesound_community-heavy-rain-under-porch-25785.mp3 # 12 軒下から見る通り +8.8
- freesound_community-rain-from-porch-30654.mp3        # 13 格子戸が半分開く +4.6
# ── 第三幕 屋内（雨が遠のき、高い方が落ちてこもる）──────────────
- freesound_community-180517-rain-heavy-wash-dripping-metal-eavestrough-toronto-23430.mp3  # 14 土間 -1.0
- freesound_community-dribbling-rain-snow-melt-from-roof-1-25510.mp3   # 15 廊下の奥      -4.0
- dbsound-balkan-street-rain-echo-532507.mp3           # 16 座敷に座る後ろ姿 -7.4
- freesound_community-180517-rain-heavy-wash-dripping-metal-eavestrough-toronto-23430.mp3  # 17 障子紙に映る雨 -1.0 ★紙のすぐ向こうなので近い
- freesound_community-dribbling-rain-snow-melt-from-roof-1-25510.mp3   # 18 障子越しの庭  -4.0
- saturn-3-music-cozy-strong-rain-under-umbrella-116184.mp3  # 19 手水鉢    -8.7
- dbsound-balkan-street-rain-echo-532507.mp3           # 20 行灯のそば      -7.4
- saturn-3-music-cozy-strong-rain-under-umbrella-116184.mp3  # 21 誰もいない座敷 -8.7 ★最も遠い
#   ★第三幕は da-wa-wa-i を外したので4本で9場面を回している。19と21、20と22が
#     1つ飛びで同じ素材になるが、8分ずつ離れた雨なので聞き分けられない。
- dbsound-balkan-street-rain-echo-532507.mp3           # 22 雨の庭         -7.4

# 11場面 × 2 ではなく、三幕の道筋そのもの。1場面＝1トラック＝8分17秒。
# ★1枚あたりが長いのは意図。 継ぎ目が少ないほど睡眠用として良い。
scenes:
- 通りの入口・引き★人物
- 濡れた石畳・寄り
- 格子戸の連なり・引き
- 番傘の後ろ姿・中景★人物（サムネ候補）
- 水たまりの波紋・寄り
- 辻の常夜灯・引き
- 傘の下から・見上げ★人物
- 石橋と堀・引き
- 軒下に入る・中景★人物
- 軒の雨だれ・寄り
- 立てかけた番傘・寄り
- 軒下から見る通り・引き★人物
- 格子戸が半分開く・後ろ姿★人物
- 土間・引き
- 廊下の奥・引き
- 座敷に座る後ろ姿・引き★人物
- 障子紙に映る雨・寄り
- 開いた障子越しの庭・引き
- 行灯のそば・中景★人物
