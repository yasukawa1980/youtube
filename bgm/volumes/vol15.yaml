# Whispers of Japan / Vol.15 — 月夜のすすき野
#
# ★★シリーズで初めて「在庫＋新規」の折衷で作る巻（2026年8月17日 本人決定）。
#   22曲のうち **⑨琵琶5・⑧龍笛4＝9本だけを新しく作り**、残る13本は
#   Vol.11〜14の未使用在庫から引く。Vol.14は88本作って22本使った（採用の4倍）。
#   この巻の生成は **24本前後**で済む。詳しい配分は下の select を参照。
#   在庫の実数と根拠はメモリ whispers-leftover-inventory。
#
# ★★シリーズで初めて虫の音を敷く巻。純器楽の看板を降ろす判断ではなく、
#   **Vol.5「蛍の川」に続く2本目**（Vol.5だけ川の音が入っている。実測で確認済み）。
#   Vol.1に自然音が入っているという資料上の記述は計画で、実行されていない
#   （メモリ vol1-has-no-nature-sounds）。
#
# ★作業先はSSD。内蔵の空きが12GBしかない（60分はピークで8GB前後使う）。

genre: whispers
volume: 15
slug: vol15
dir: "/Volumes/ESD-EPB/BGM/1_Whispers of Japan/Vol15_素材_すすき野"

# 題材＝月夜のすすき野／テーマ「満ちる」
#   月が満ちる（中秋の名月）／穂が野を満たす／虫の音が沈黙を満たす。
#   **この巻で初めて音が加わることを、テーマの側で引き受けている。**
#
# ★差別化の軸は「地平線」。 既存14本＋コンピ2本＋Long Nights 3 のどれも、
#   見上げ（Vol.12）・見下ろし（Vol.6）・囲まれた中（Vol.2/11/13/14）で、
#   **一度も「平らに開けた場所」を出していない。** 空が半分を占め、
#   遠くまで遮るものが無い画はこの巻が初めて。
# ★光は逆光。 穂は透過光で銀色に光る。Vol.8（下から暖色）とも
#   Vol.13（透ける冬木立）とも当たり方が違う。
# ★2026年8月18日、22枚を168pxで実測して決定。**19（西へ傾く・引き）。**
#   当初の候補は13（逆光の銀）だったが、題字の下に月と雲が入り込んで最悪だった
#   （文字が乗る帯の最大輝度255・ばらつき50.6）。19は最大162・ばらつき25.4で地が静か。
#   11（中天）も地は静かだが絵側の情報量が最少（30）で、168pxではただの平原に見える。
#   19は長い影の帯が斜めに走るので168pxでも構造が残り、絵側の情報量も34ある。
#   **月だけが暖色**になるのでチャンネル一覧で青の中に埋もれない（Vol.8の赤とも別物）。
background: "/Volumes/ESD-EPB/BGM/1_Whispers of Japan/Vol15_素材_すすき野/画像/vol15_19.png"

title_lines: [月夜の, すすき野]
