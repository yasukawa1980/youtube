# ★22曲・60分。Vol.11/12/14と同じ構成（画像22枚＝1曲1枚）。
# ★kind_limits の下限が要（Vol.14で④金属打が1本に痩せた反省）。
#   **新規の⑨琵琶5・⑧龍笛4を下限で固定する**のがこの巻の肝。
#   下限に書かないと、在庫の多い種（尺八33本）で埋まって新規枠が痩せ、
#   「新しく作った意味」が消える。
# ★breath_floor で在庫の尺八を先に切る。残り33本のうち0.05超えは4本しかない
#   （0.0799 / 0.0579 / 0.0536 / 0.0536）。この4本から3本を採る想定。
select:
  count: 22
  total_seconds: [3500, 3720]     # 58〜62分
  require_all_kinds: true
  max_per_kind: 5
  restarts: 150
  breath_floor:
    ②尺八: 0.05
  kind_limits:
    ①箏: [2, 3]
    ②尺八: [3, 3]      # breath_floor を通るのが4本しかないので幅を持たせない
    ③ピアノ: [1, 3]
    ④金属打: [1, 3]
    ⑥胡弓: [1, 3]
    ⑦笙: [1, 2]
    ⑧龍笛: [4, 4]      # ★新規
    ⑨琵琶: [5, 5]      # ★新規
    ⑩フル編成: [2, 3]
  # 下限の合計20・上限の合計29。22がその間に入っている。
  # ★下限の合計を22ちょうどにしないこと。配分が1通りに固定されて選抜が選抜でなくなる
  #   （long3.yaml の max_per_kind と同じ理屈）。いまは余白が2ある。
  # 新規9本（琵琶5＋龍笛4）＋在庫13本。

order:
  restarts: 400


