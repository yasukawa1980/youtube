#      （虫は風の夜に鳴かない）。画が呼ぶ疑問に、この巻は初めて音の側で答えている。
#   2. 富士山 … すすき＋満月でAIが必ず出す。遠景の山は低い稜線だけにする
#   3. 水 … 池・川・濡れた路面。写ると水音を期待される（Vol.5と紛らわしくもなる）
#   4. 月見の道具 … 三方・団子・薄の活け花。器物と文字の崩れを呼ぶ。Vol.10と被る
#   5. 稲・麦 … 黄金色の穂はVol.7の棚田と麦畑に見える。**穂は銀白色・羽毛状**で通す
