# Echoes of Old Japan / 07 —— 即興曲と間奏曲
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   シューベルトの即興曲 D.899-3・ブラームスの間奏曲 Op.118-2・ラフマニノフの前奏曲 Op.23-10 を素材に、
#   曲・音階・主音・テンポ・旋律楽器の5軸で8変奏を作り、8秒クロスフェードで繋いだ59分22秒。
#   実装は bgm/EOJ07_即興曲と間奏曲/album.py（描画57秒）、構成は同フォルダの 構成.md。
#   ★ECJ07（16分06秒の作品版）と素材も描画器も共有している。
#
# ★★即興曲だけ `limit=450` で切る（696拍あり、54bpm では12.9分になって床に入らない）。
#   A-B-A の A の側だけが鳴り、次の変奏へ8秒で重なるので切れ目は出ない（EOJ04 と同じ手当て）。
#
# ★★実測 59分22秒 / **−14.0 LUFS / TP −1.6**（wav）。当て込みは不要（入力 −16.48）。
#   DC は `dcfix`（25Hz高域通過）で 0.000000。★床でDC除去を通したのはこの巻から。

# ★★画題は「滝」。 既刊16巻と幾何が重ならないものを選んだ
#   （ECJ01海／02参道／03棚田／04橋／05藤棚／06竹林／07雪の庭／08山寺の雨／
#     09書院の丸窓と紅葉／10鯉のぼりの里／EOJ01月と水／02森の内側／03蓮池／04梅林／
#     05苔庭と飛び石／06枯山水）。
# ★★作品版と同じ画題にしない（同じ曲の2本が棚で競合する）。EOJ05 で藤棚→苔庭にしたのと同じ判断。
# ★★場面2をいちばん暗くする（音の陰に絵の夜を当てる）。EOJ06 で組み直して決めた規則。
# ★露出は受け取ってから実測する（16未満の割合。平均輝度では合わせない）。
#   サムネは題字の乗る側の地を 12〜16 に。

genre: echoesofoldjapan
volume: 7
slug: eoj07
dir: "/Volumes/ESD-EPB/BGM/5_Echoes of Old Japan/EOJ07_素材_即興曲と間奏曲"

runtime: "59 MIN"
title_lines: [IMPROMPTU, SCHUBERT]
thumb:
  title_family: serif
  title_fit: 760
  tracking:
    brand: 4

scenes:
- 01 夕の滝（曲01-02。西日が崖の上端と滝頭だけに届く）
- 02 雲の夜の滝（曲03-04。★いちばん暗い。月は無い。落ちる柱だけが淡い）
- 03 月の滝（曲05-06。★見せ場。柱が銀に光り、淵が割れた月を映す）
- 04 朝靄の滝（曲07-08。飛沫の靄が谷を満たし、いちばん明るい）
- 05 サムネ専用（本編には使わない。左三分の一が岩の影）

# ★プロンプトの全文は bgm/EOJ07_即興曲と間奏曲_画像プロンプト/ にも同じものが置いてある（Codex へ渡すのはそちら）。
image_prompts:
- >-
  A tall waterfall in a wooded Japanese gorge, at sunset. Seen from a flat rock on the bank
  downstream, at the height of the pool, looking straight at the fall: the water drops in one
  narrow white column from a notch high in the dark cliff, breaks on a jutting shelf two thirds of
  the way down, and lands in a deep round pool that fills the lower third of the frame. Wet black
  rock walls streaked with moss close the picture on both sides and behind the fall; nothing is
  visible beyond the gorge, no distant landscape and no horizon. Three mossy boulders stand in the
  pool, and two maples lean in from the right. The last warm light reaches only the top edge of
  the cliff and the head of the fall, so the column glows warm white at the top and cools to grey-
  blue as it drops into shadow. The narrow band of sky visible above the gorge is a soft gradated
  wash of orange into violet. Orange, warm white, wet black rock, deep moss green. Japanese shin-
  hanga woodblock print in the manner of the 1920s-30s revival: flat layered areas of colour,
  visible woodgrain in the flat passages, softly gradated sky (bokashi), Western perspective and
  cast light held inside Japanese printmaking. Calm, unpeopled, no figures. Strong clear
  difference between the light and dark masses so the image still reads when reduced to a
  thumbnail. No text, no signature, no seal stamp, no lettering of any kind. No modern objects: no
  power lines, no utility poles, no electric lamps, no vehicles, no plastic, no road markings.
  Wide 16:9 landscape. Exposed so that texture is clearly visible everywhere. Shadows are lifted
  and open, full of visible detail, nothing crushed to pure black. High dynamic range, rich
  texture even in the darkest areas.
