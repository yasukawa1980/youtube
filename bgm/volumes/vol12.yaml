# ジャンル側の image_style（露出の指示つき）とガンマ1.3が自動で付く。
#
# ★見上げの画は遠近を「強調」して出す。Vol.11で真上のショットを出すのに
#   `no convergence, no perspective, no vanishing point` と遠近を否定したのの逆で、
#   `strong upward convergence` `extreme worm's-eye view` と収束そのものを書く。
#   `looking up at` だけではアイレベルの写真が返る。
# ★塔は右、空は左1/3。全場面で徹底すると題字帯が空になり、サムネの文字が乗る。
# ★各文の末尾に共通の禁止句。寺の建築はVol.8の山門以来の崩れ字リスクなので、
#   木札・千社札・扁額・幟を列挙し、あわせて中国/タイの塔になる事故も否定する。
#   白漆喰の面は「連子窓（縦格子）と板壁の木目」を描かせて埋める（Vol.10の掛け軸の手）。
