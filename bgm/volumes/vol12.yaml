# Whispers of Japan Vol.12 — Moonlit Pagoda（月夜の五重塔）／テーマ「仰ぐ」
#
# フェーズ2の2本目。62〜66分・22曲・全曲新規。
# 設計は ~/Desktop/Whispers of Japan/Vol12_テーマ設計とプロンプト.md
#
# 差別化の軸は「視線の向き」。Vol.1〜11とコンピ2本の13本すべてがアイレベルか俯瞰で、
# 一度も上を向いていない。Vol.11（水平の反復・明るい地面に黒い石）に対して、
# Vol.12は垂直の反復・明るい空に黒い塔で、図と地が反転する。
#
# ★注意：`--write` は yaml.safe_dump でこのファイルを丸ごと書き直すため、
#   コメントが全部消える。select / order をやり直したら注記を入れ直すこと。

genre: whispers
volume: 12
dir: "~/Desktop/Whispers of Japan/Vol12_素材_五重塔"

# サムネの元画は場面9B（相輪と月・寄り）＝ 18枚目。
# 生成した画像をそのまま使う（Vol.11の Vol11_背景_01.png も同じ 1536x864 の複製だった）。
background: "~/Desktop/Whispers of Japan/Vol12_素材_五重塔/画像/vol12_18.png"

title_lines: [MOONLIT, PAGODA]
runtime: "64 MIN"                      # 仮。音声が確定したら実尺と突き合わせる

# 楽曲が揃ったら埋める。ファイル名（末尾の " (1)" を除いた形）→ 音色の種類。
# 8種：①箏 ②尺八 ③ピアノ ④風鐸 ⑤胡弓 ⑥笙 ⑦龍笛 ⑧フル編成
# ★⑦龍笛がこの巻の新規枠。②尺八と発音（吹く）が同じなので、分離できるかは
#   analyze の一致度を見てから採用本数を決める。高く出たら④で埋める。
kinds: {}

# ★max_per_kind は 4。3だと 3×7＋フル1＝22 でちょうど埋まり、配分が1通りに
#   固定されて選抜が選抜にならない（Vol.11で判明）。
# ★kind_limits の下限が要る。require_all_kinds は「最低1本」でしかないため、
#   一致度の最小化だけだと候補の少ない種が1本まで痩せる。
select:
  count: 22
  total_seconds: [3720, 3960]          # 62〜66分
  max_per_kind: 4
  kind_limits:
    ⑧フル編成: [1, 1]
    ②尺八: [2, 2]
    ⑥笙: [2, 4]
    ⑦龍笛: [2, 4]
  breath_floor:
    ②尺八: 0.05
    # ★この巻は残響ゼロに振っている。Vol.11（最良0.0537）を超えるかが検証点。
    #   超えれば「長い残響の指示が息のノイズを埋める」が確定する。
    #   ⑦龍笛は澄んだ音が設計なので足切りしない。

# 17曲目＝場面9A（相輪と月）＝クライマックス。
# 1曲目はチャンネルの看板の音（尺八）で開ける。
order:
  fixed:
    1: ②尺八
    17: ⑧フル編成

