# ★★3人の作曲家を2行に入れない。 `SCHUBERT · BRAHMS · RACHMANINOFF` は32字で、
#   title_fit 760 に対して級数が落ちすぎる（ECJ06の `BACH & GOUNOD` は13字）。168pxで読めなくなる。
#   → **3曲で最も有名で、尺も最長（6分33秒 / 全16分06秒）の即興曲を代表に立てる。**
#     ブラームスとラフマニノフは章立てと説明文で出す。
