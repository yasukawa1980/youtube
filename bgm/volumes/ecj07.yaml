# ★★サムネと冒頭を**はじめから2枚に分けた**（ECJ03〜05の教訓）。
#   2026年9月9日に本人が「サムネ由来で左側が黒く塗りつぶされて見える」と指摘し、
#   ECJ03・04・05は冒頭専用の絵を作り直している。この巻は最初から分けてある。
#     04 サムネ専用 … 左半 <16% 11.41% / 平均47.1（題字が乗る）／右半 平均106.6
#     05 冒頭専用   … 左半 <16%  0.57% / 平均167.2（右半153.4より明るい）
#   ★題字と地の差は **180.4 でラインで最良**（ECJ06 87.9 / ECJ05 100.2 / ECJ02 109.2 / ECJ03 128.8）。
#
# ★楽器は笙。 ECJ04・05が箏、ECJ06が尺八なので棚の中で自己競合しない。
#   3曲とも笙が鳴っている（実測 171 / 124 / 45音）。
#   ★★原寸では笙は正しい（長さの違う竹管が環状に立ち、風箱を両手で支え、唇が吹口に当たる）。
#     **ただし168pxでは「顔の前の淡い縦棒」にしか見えない。**
#     それでもサムネが成立しているのは、「人＋柱の列」の**柱の列を雪吊りの円錐が担っている**から
#     （ECJ06が「人＋竹林」で成立させたのと同じ）。**笙を大きく描き直す案は採らない。**
