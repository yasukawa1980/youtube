# European Classics, Japanese Instruments / 07 —— シューベルト 即興曲／ブラームス 間奏曲／ラフマニノフ 前奏曲
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   実装は bgm/ECJ07_即興曲と間奏曲/（build.py が通しで書き出す。描画12秒）。
#   構成と実測は同フォルダの 構成.md、選曲の根拠は bgm/ECJ07_選曲案.md。
#   ★描画器 piano.py は EOJ05 の debussy.py そのままで、**変えたのは1行だけ**
#     （右手／左手を固定のトラック1・2ではなく rh_tr / lh_tr で指定できるようにした）。
#
# ★★曲は測ってから決めた。 ECJ06の545曲の計測（ECJ06_選曲調査/）をそのまま読み、
#   主音は12通り測って和がいちばん小さい **律・主音A** を取った（主音で和が2.4倍動く）。
#     即興曲 ずれ3.4 / 潰れ16.2 ／ 間奏曲 1.3 / 14.0 ／ 前奏曲 4.6 / 6.8
#   **3曲ともずれが5%未満**で、ECJ04のノクターン（11〜20%）より良く、ECJ05と同じ帯。
#
# ★★この巻の売り：**変ト長調は「黒鍵の調」。**
#   即興曲と前奏曲はどちらも変ト長調で、その主要5音（G♭ A♭ B♭ D♭ E♭）は
#   **ピアノの黒鍵5つそのもの＝律と同じ形**。主音F#（＝変ト）のまま測ると
#   即興曲のずれは 0.6% で、545曲でグノー（0.0%）に次ぐ2位。
#   ★ただし主音はF#にしない（ブラームスが8.2%に落ちる）。**売りは選曲の理由であって主音の理由ではない。**
#
# ★★★この巻で見つけた：**synth.koto にDCオフセットがある**（1音あたり平均+1.7%）。
#   尺八と笙は0.000で箏だけ。重なると溜まり、即興曲は**ピーク0.890のうち半分がDC**だった。
#   ヘッドルームを半分食い、ラウドネスが10dB低く出て、**loudnorm が壊れる**
#   （−14.0狙いで I −17.8 / ピーク +0.4）。
#   → **build.py の dcfix() で曲ごとに25Hzの高域通過を掛けてからピーク正規化する。**
#   ★synth.py は直さない（公開済みの巻と EOJ06 が同じ関数を使っている）。
#   ★既刊のDC：ECJ05 −0.092（0〜40Hzが94.1%）／ECJ06 +0.050／EOJ06 +0.017。**遡って直すかは本人の判断。**
#
# ★実測 16分06秒 / **−14.0 LUFS / TP −2.0**（wav）→ 完成AAC −14.0 / **−1.9**。
#   **当て込み不要。AAC段の上がりは +0.1dB でラインで最小**（ECJ06 +0.6 / EOJ05 +0.9）。
# ★浄書は PD / PD / **CC BY-SA 4.0**（ラフマニノフ）。**ShareAlike はこのラインで初めて。**
#   楽曲は3曲ともPD。ECJ06から入れているクレジットの1行は今回も入れる。
genre: europeanclassics
