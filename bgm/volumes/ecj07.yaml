# ★★画題は「雪の庭」。 ECJ01＝海、ECJ02＝参道、ECJ03＝棚田、ECJ04＝橋、ECJ05＝藤棚、ECJ06＝竹林、
#   EOJ01＝月と水、EOJ02＝森、EOJ03＝蓮池、EOJ04＝梅林、EOJ05＝苔庭、EOJ06＝枯山水。
#   **「白い面と、そこに数少なく立つ黒いもの」は未使用。**
# ★★季節でも空いている。既存12巻に冬が1本も無い。
# ★★音との結びつき＝この巻の売りそのもの。 売りは「変ト長調は黒鍵の調」で、
#   **雪の庭はその形を絵にしたもの**——画面はほとんど白く、黒く残るのは松・灯籠・瓦・水だけ。
#   ★実利：明暗の差が最大になるので168pxでいちばん読める。
# ★おまけの事実：**シューベルトの即興曲 D.899 は『冬の旅』と同じ1827年。**
#
# ★★3枚で崩してはいけない幾何（プロンプトに同じ文で入れてある）：
#   ①中央やや右に雪吊りをした黒松（円錐に放射する縄）②左手前に雪見灯籠
#   ③下三分の一に凍っていない黒い池 ④奥は土塀と瓦。**塀の向こうは見せない**（ECJ01の海と競合するため）
#   ⑤左三分の一は静か
#   → **実測：01を基準に松と灯籠を探して、02・03とも 縦0 / 横0 画素。**
#
# ★露出の実測（16未満の割合／平均輝度）：
#     01 0.14% / 175.6　02 1.70% / 127.6　03 **5.27% / 69.4**（ECJ06の月夜7.62%より潰れていない）
#     04 サムネ 7.14% / 76.9　05 冒頭 0.79% / 160.3
#   光の弧は 175.6 → 127.6 → 69.4 と一方向に落ちる。
scenes:
- 01 即興曲 D.899-3・降りしきる雪の昼（いちばん明るい）
- 02 間奏曲 Op.118-2・雪の止んだ夕（いちばん温かい）
- 03 前奏曲 Op.23-10・月の出た夜（いちばん暗い）

