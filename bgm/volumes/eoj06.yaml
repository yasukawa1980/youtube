# Echoes of Old Japan / 06 —— アヴェ・マリア
#
# ★★音は bgmkit の外で作っている。 select / order / audio は使わない。
#   バッハの前奏曲 BWV846・グノーのアヴェ・マリア・バッハのアリオーソ BWV1056 を素材に、
#   曲・音階・主音・テンポ・旋律楽器の5軸で8変奏を作り、8秒クロスフェードで繋いだ59分28秒。
#   実装は bgm/EOJ06_アヴェマリア/album.py（描画38秒）、構成は同フォルダの 構成.md。
#   ★ECJ06（13分56秒の作品版）と素材も描画器も共有している（avemaria.py＝ecj06.py＋旋律楽器の切替）。
#
# ★★この巻の決まり：**アヴェ・マリアは一度も都節に落とさない**（EOJ05とここが違う）。
#   実測：グノーの旋律は**律ならどの主音でも ずれ0.0%**（211音が5音から一度も外れない）。
#   **都節に写すと最良でも18.1%**で、この巻の売りがそのまま壊れる。
#   → 陰は**前奏曲とアリオーソだけ**（03翳る・04沈む・05底）で作る。
#
# ★★変奏の音量を揃える工程を足した（この巻で初めて要った）。
#   `synth.write_wav` は書き出すたびにピーク0.89へ正規化するので、変奏の音量が
#   波高率で決まる。実測 **−15.8〜−21.6 LUFS の5.8LU差**（EOJ05は2.7LUで問題にならなかった）。
#   アヴェ・マリアは1369音が詰まって平均が高く、アリオーソは遅くて疎いぶん低い。
#   → **いちばん静かな変奏を動かさず、差を0.35倍（5.8→2.0LU）に詰めた**。平らにはしない。
#
# ★★実測 59分28秒 / **−14.2 LUFS / TP −1.7**（wav）。**当て込みは要らなかった**
#   （入力 −20.38 LUFS / TP −1.01。EOJ04と同じでTP側の制約に当たらない）。
#   ★AAC段の上がりは **+0.6dB**（wav −1.7 → AAC −1.1）。EOJ03・EOJ04 と同じ −1.1 に着地。
#   ★TP は −1.6 ではなく **−2.0 で焼くこと**。−1.6だとAACがちょうど −1.0 に乗って余裕が無い。
