# ★★画題は「枯山水」。 既存11巻と幾何が違う——
#   海の水平線／参道の遠近／棚田の層／橋の弧／藤棚の垂れる房／竹林の縦の線／
#   月と水／森の内側／蓮の面／梅の枝の分岐／苔庭の飛び石（点の連なり）。
#   **枯山水は「同心円の砂紋と、平行に引かれた掃き目」**で、どれとも重ならない。
#
# ★★作品版（ECJ06）が竹林なので、同じ曲の2本が棚で競合しないよう別の画題にした
#   （EOJ05で藤棚→苔庭にしたのと同じ判断）。
#
# ★★画題と音が結び付いている（この巻の説明文の柱）。
#   ① **バッハの前奏曲は、同じ分散和音の型を35小節ずっと繰り返す音楽。**
#      砂紋は同じ線を延々と引いたもの。**形が同じ。**
#   ② **枯山水は「水の無い水」——石と砂で水を表す。**
#      この棚は「西洋の曲の姿を借りて、日本の音で鳴らす」。**借りた形で別のものを表す点が同じ。**
#
# ★★EOJ05の生成で判った3つの穴を、はじめから塞いである：
#   ① `no buildings` と書くと**庭を閉じる塀まで消える**（囲いが無いと庭に見えない）
#      → 土塀で奥を閉じ、その向こうを一切見せないと書いた
#   ② **遠景を禁じないと山と海が入る**（★ECJ01の画題が海なので競合する）
#      → `Nothing is visible beyond the wall` を4枚すべてに入れた
#   ③ `seen from slightly above` では俯瞰にならない
#      → 「縁側の高さから、砂の面を見渡す」と高さを具体的に書いた
#
# ★★光の弧は 夕 → 雲の夜 → 満月 → 東雲。**一晩を通って夜明けで終わる。**
#
# ★★★2026年9月10日、**場面を組み直した（本人決定・A案）**。
#   1回目は 暁闇 → 夕 → 月 → 東雲 で生成し、幾何も露出も合格したが、
#   **音の弧と逆になっていた** ——
#     画2（14:50〜）に当たるのは 曲03「翳る」・曲04「沈む」で**この巻でいちばん暗い音（都節）**。
#     そこに**いちばん明るい絵（夕焼け・平均輝度115.7）**が乗っていた。
#   EOJ05は 朝(67.0) → **夜(34.5・いちばん暗い)** → 靄と月(66.6) → 明ける(94.7) で、
#   **音の陰に絵の夜が当たっていた。** その形にできていなかった。
#   加えて「暁闇（下弦の三日月＝明け方）→ 夕焼け」は1時間の中で半日以上飛ぶ。
#   → **画1を既存の「夕」に繰り上げ、画2に「雲の夜」を1枚だけ足した。**
#     **`eoj06_01.png`（暁闇）は控えに回す。本編には使わない。消さないこと。**
#
# ★4枚は同じ庭・同じ構図で、光だけが変わる（実測：石の塊のずれは最大 縦−2 / 横−2 画素）。
# ★露出の実測（16未満の割合／平均輝度。★平均輝度では合わせない）：
#     02 夕 3.52% / 115.7   03 満月 5.18% / 111.8   04 東雲 1.76% / 146.0
#     05 サムネ 45.99% / 45.6（左半 87.24% / 13.2・右半 4.75% / 77.9。真の0は0.00%）
#     06 雲の夜 → **平均輝度60〜75を狙う**（03よりはっきり暗く、しかし潰さない）
scenes:
- 01 夕の枯山水（曲01-02。西日が石の影を長く引く）
- 02 雲の夜の枯山水（曲03-04。★いちばん暗い。月は雲の向こう）
- 03 月の枯山水（曲05-06。★いちばんの見せ場。砂紋が銀に光る）
- 04 東雲の枯山水（曲07-08。東の空が金に染まりはじめる）
- 05 サムネ専用（本編には使わない）
- （控え）暁闇の枯山水 eoj06_01.png … 1回目の画1。**本編には使わない**

