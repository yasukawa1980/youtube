# ★★画題は「山寺の書院の丸窓と紅葉」。ECJで初めての室内。
#   ECJ01＝海、02＝参道、03＝棚田、04＝橋、05＝藤棚、06＝竹林、07＝雪の庭、08＝山寺の雨、
#   EOJ01＝月と水、02＝森、03＝蓮池、04＝梅林、05＝苔庭、06＝枯山水。
#   **「壁いっぱいの面に、ひとつの完全な円」は未使用。**
# ★★4枚で崩してはいけない幾何：①畳に座った目の高さで正面の壁をまっすぐ見る（円が楕円に歪まない）
#   ②土壁が端から端まで、左右に柱1本ずつ ③中央に完全な丸窓（直径は画面の高さの約3分の2）
#   ④円の中だけに庭（紅葉の枝・苔・池・石灯籠・低い土塀で閉じる。塀の向こうは見せない）
#   ⑤手前に畳の縁、左下に文机と鉄瓶 ⑥文字のあるものは置かない
# ★★Whispers Vol.8「月夜の紅葉と古寺」と棚で競合するので、04は赤を小さく深くしてある。
#
# ★★★2026年9月13日、公開用は4区間になった（本人指示）。
#   本人の視聴で「場面2と3の間に1が入る」と指摘があり、**5:07.10の「01へ戻る」を外した**。
#   **公開用（動き付き修正版）は 01 → 02 → 03 → 04**。02が 3:50.40〜5:53.18 を通しで持つ。
#   ★下の5区切りの記述と `images`（01を2回）は**静止画版 `ecj09_完成.mp4` の作り**で、そちらは5区間のまま。
#     静止画版は控えなので公開しない。**この巻をbgmkitで焼き直すときは、images を 01・02・03・04 にして
#     manifest も4区切り（0 / 230.40 / 353.18 / 508.83）へ直すこと。**
#
# ★（以下は当初の5区切りの設計。静止画版の記録として残す）
