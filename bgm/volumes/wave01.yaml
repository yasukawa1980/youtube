# Waves of Japan / 01 — 月の水鏡（Moonlit Water Mirror / Alpha 12Hz → 8Hz）
#
# ★シリーズ共通の設定は genres/waves.yaml（`extends: oldjapan`）。ここは この巻に固有のものだけ。
# ★設計の全体は WAVE01_テーマ設計.md。ビート層の生成は WAVE01_ビート生成.sh。
# ★作業先はSSD。3時間の書き出しで4GB超。ビートのwavだけで別に3.6GBある。

genre: waves
volume: 1
slug: wave01
dir: "/Volumes/ESD-EPB/BGM/4_Waves of Japan/WAVE01_素材_月の水鏡"
tracks_subdir: 曲

# ★サムネの題字は日本語1行（SOJ02 で確立した作法）。
#   168pxの仕事は「読ませる」ことではなく「目に留まる」こと。漢字のほうが圧倒的に読める。
title_lines: [月の水鏡]
thumb_layout:
  brand: 360
  t1: 470
runtime: "3 HOURS"

# ★★尺は5等分しない。 光は等速で落ちないし、最後は誰も起きていない。
#   1800+1500+1800+2400+3332 − 4×6 = 10808秒 = 3時間00分08秒（SOJ01・SOJ02 と同じ）
#     1 薄暮    30:00  うなり 12.00 → 11.33 Hz
#     2 宵      25:00        11.33 → 10.78 Hz
#     3 月の道  30:00        10.78 → 10.12 Hz
#     4 凪      40:00        10.12 →  9.23 Hz
#     5 靄      55:32         9.23 →  8.00 Hz  ★最長。ここまで起きている人はほぼ居ない
track_seconds: [1800, 1500, 1800, 2400, 3332]

audio:
  # ★★mosaic を音程のある素材で回すのは初めて。
  #   1場面が25〜55分あるので、パッド1本のループでは周回が必ず聞こえる。
  #   同じ調(G)の静止和音を3〜4本重ね、それぞれ違う周期で回して繰り返しを消す。
  #   ★環境音と違い、重なり方で和音が動く恐れがある。
  #     **まず1場面ぶんだけ組んで聴いて確かめること。**
  #     駄目なら mosaic を丸ごと外して1場面＝1本の track_seconds に落とす
  #     （継ぎ目は増えないので実害は周回だけ）。
  mosaic:
    # ★片は環境音（30〜50秒）より長く取る。音楽は短く刻むと切り貼りに聞こえる。
    cell: [60, 120]
    layers: [2, 3]
    # ★bed_lra を高く取って全部を「床」にする。
    #   パッドが点景として散発的に出入りすると、音楽では不自然に聞こえる。
    bed_lra: 12.0
    seed: 1

# ★★ビート層。 中心 196Hz(G3) 固定・うなり 12Hz → 8Hz へ3時間かけて直線降下。
#   生成は `bash WAVE01_ビート生成.sh <出力先>`（約8分・3.6GB）。
#   ★no_loop はジャンル側で true。素材が最初から3時間あり時間とともに変化するので、
#     ループ化すると尻の8Hzが頭の12Hzに混ざって壊れる。
#   ★gain_db -28 はジャンル側の見込み値。`audio` の末尾の実測を見て決め直すこと。
ambient:
  file: "/Volumes/ESD-EPB/BGM/4_Waves of Japan/WAVE01_素材_月の水鏡/ビート/wave01_beat_3h.wav"

# ★★床は全部 G調・持続音のみ・アタック無し。 プロンプトは WAVE01_コピー用プロンプト.md。
#   撥・打・息の立ち上がりがあるものは1本も入れない（3時間で必ず起こす）。
#   1場面につき 2プロンプト × 2テイク = 4本。
order_tracks:
- [薄暮A1.mp3, 薄暮A2.mp3, 薄暮B1.mp3, 薄暮B2.mp3]
- [宵A1.mp3, 宵A2.mp3, 宵B1.mp3, 宵B2.mp3]
- [月の道A1.mp3, 月の道A2.mp3, 月の道B1.mp3, 月の道B2.mp3]
- [凪A1.mp3, 凪A2.mp3, 凪B1.mp3, 凪B2.mp3]
- [靄A1.mp3, 靄A2.mp3, 靄B1.mp3, 靄B2.mp3]

# ★1場面＝1枚。25〜55分ずっと映る。「情景」ではなく「見ていられる絵」を作ること。
scenes:
- 薄暮・桟橋の突端に立つ（残照／映り込みが砕けている）
- 宵・岸辺に座る（藍一色／東の山際に月が出る）
- 月の道・水際に立つ（月柱／映り込みが本人と同じだけ鮮明）
- 凪・無人の湖（完全な鏡／小舟と上下対称の山）
- 靄・無人（水平線が消え、二つの月のどちらが本物か分からない）

# ★★人物は淡い縹色(はなだいろ)の着物・肩に薄物・低い束ね髪。
#   SOJ01(濃紺の着物)・SOJ02(麦わら帽子)と被らせない3点。
# ★★場面4で居なくなる。 最後の95分は無人で、そこが一番長く映る。
# ★★サムネだけは別画像（顔あり）。 本編5枚は顔を見せない。
#   1枚が25〜55分映り続けるので、顔があると見つめられ続けて必ず粗が見つかる。
# ★★サムネは本編の場面02を流用する（2026年8月27日、本人の指定）。
#   SOJ02 は「サムネだけ別画像で顔あり」だったが、SOJ01 は全編後ろ姿でサムネもそうなので
#   シリーズの型からは外れない。SOJ01 の設計もサムネを本編の場面から選ぶ形だった。
background: "/Volumes/ESD-EPB/BGM/4_Waves of Japan/WAVE01_素材_月の水鏡/画像/wave01_02.png"
images:
- wave01_01.png
- wave01_02.png
- wave01_03.png
- wave01_04.png
- wave01_05.png

# ★★縦型ショート5本。 5つの光の状態から1本ずつ採る。
#   字幕の1行目を場面と周波数にする——**この巻の売りは「降りていく」ことなので、
#   5本並べると降下そのものが伝わる。**
# ★場面の頭＝ 0:00 / 30:00 / 54:54 / 1:24:48 / 2:04:42。どれも頭から十分内側で採る。
# ★anchor（9:16に切るときの横位置）は 0.5 の仮値。
#   **画像ができたら実際に切って目で確認して決め直すこと。**
#   この巻は月と人物を右に寄せる指定なので、多くは 0.6 前後になるはず。
shorts:
- tag: A
  image: 1
  anchor: 0.5
  at: "0:12:00"
  title: 月の水鏡
  sub: [薄暮 12Hz, 3時間版はチャンネルに]
  move: in
- tag: B
  image: 2
  anchor: 0.5
  at: "0:40:00"
  title: 月の水鏡
  sub: [宵 11Hz, 3時間版はチャンネルに]
  move: out
- tag: C
  image: 3
  anchor: 0.5
  at: "1:05:00"
  title: 月の水鏡
  sub: [月の道 10Hz, 3時間版はチャンネルに]
  move: in
- tag: D
  image: 4
  anchor: 0.5
  at: "1:40:00"
  title: 月の水鏡
  sub: [凪 9Hz, 3時間版はチャンネルに]
  move: out
- tag: E
  image: 5
  anchor: 0.5
  at: "2:30:00"
  title: 月の水鏡
  sub: [靄 8Hz, 3時間版はチャンネルに]
  move: in
