# 題材＝月夜の大銀杏／テーマ「手放す」
#   大銀杏は**一晩のうちに葉をほとんど落とす**ことがある（「一夜で散る」）。
#   満月の昇る夜、金色の樹冠が一枚ずつ葉を手放し、夜明けには裸の樹の下に金の円だけが残る。
#   千年ぶんの秋を重ねてきた樹が、今年の葉を静かに手放す一夜。聞き手が一日を手放して眠る巻。
#
# ★差別化の軸は「青い夜に金の樹一本」。 Vol.8紅葉（赤・灯籠で下から照らした暖色）とは
#   光源で分ける：**灯りは使わず、葉そのものの色だけが暖色**。空・石・幹は青のまま。
#   チャンネル一覧で青いサムネが並ぶなかに1枚だけ金が入る（Vol.8が赤でやったことの金版）。
# ★時間軸は「絵の中で樹が裸になっていく」こと。Vol.9雪国（夜が明けるだけ）、
#   Vol.14松（一本の樹を巡る）とは、樹そのものが変わる点で分かれる。
#   Vol.14も一本の樹だが、松は常緑で形が変わらず、色は青一色だった。
# ★image_style を巻で上書きする（ジャンルの既定は「月光のみ・くすんだ色」で金が出ない）。

# ★2026年9月30日 22枚受領（Codex生成・1672×941）→ サムネは05（大銀杏を仰ぐ・引き）。
#   左三分の一が深い青の空で、金の樹冠が右に立つ。潰れは0.3%で全22枚で最も明るい部類。
# ★潰れ（16未満）が15%を超えたのは03（石段・杉木立）だけ → lift で24.3%→11.0%（指数0.85）。元は 画像/旧版/。
