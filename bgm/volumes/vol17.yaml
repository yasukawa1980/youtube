image_style: >-
  Photorealistic cinematic still, traditional Japanese scenery at night.
  The only light source is the moon: cool blue-silver, low key — except that the
  ginkgo leaves keep their own clear golden-yellow colour, softened by the moonlight,
  the one warm colour in the picture. There are no lamps, lanterns or fires anywhere.
  Exposed so that texture is clearly visible everywhere — bark, wood grain, stone,
  every single fan-shaped leaf. Shadows are lifted and open, full of visible detail,
  nothing crushed to pure black. High dynamic range, rich texture even in the
  darkest areas.
  Calm and completely static, no people, no animals, no text, no signage,
  no lettering of any kind. Muted blue palette apart from the ginkgo gold,
  fine film grain, 16:9 composition with generous empty space on the left third for titles.

